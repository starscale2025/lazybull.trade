<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #050505; --fg: #f5f5f0; --fg-dim: #8a8a82;
    --bull: #00ff87; --bear: #ff2e63; --cyan: #00e5ff; --amber: #ffb800; --border: #1f1f1f;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; transition: none !important; animation: none !important; }
  html, body { width: 100%; height: 100%; background: var(--bg); overflow: hidden; }
  #stage {
    position: relative; width: 100vw; height: 100vh; overflow: hidden;
    background: var(--bg);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  #grid {
    position: absolute; inset: -60%;
    background-image:
      linear-gradient(rgba(245,245,240,0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(245,245,240,0.045) 1px, transparent 1px);
    background-size: 72px 72px;
  }
  #vignette {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,0.8) 100%);
    pointer-events: none;
  }
  #glow {
    position: absolute; left: 50%; top: 50%; width: 120vw; height: 120vh;
    transform: translate(-50%, -50%);
    background:
      radial-gradient(38% 42% at 42% 44%, rgba(0,255,135,0.16), transparent 70%),
      radial-gradient(34% 40% at 62% 58%, rgba(0,229,255,0.08), transparent 70%);
    pointer-events: none;
  }
  #outline { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
  #outline path {
    fill: none; stroke: var(--bull); stroke-width: 2;
    filter: drop-shadow(0 0 12px rgba(0,255,135,0.55));
  }
  #mac { position: absolute; left: 50%; top: 50%; width: 840px; height: 560px;
         transform: translate(-50%, -50%); }
  #screen {
    position: absolute; left: 50%; top: 0; transform: translateX(-50%);
    width: 780px; height: 490px; border-radius: 18px;
    background: #0a0a0a; border: 2px solid #2a2a2a;
    box-shadow: 0 0 0 8px #111, 0 30px 80px rgba(0,0,0,0.8);
    overflow: hidden;
  }
  #screen-inner { position: absolute; inset: 14px; background: var(--bg); overflow: hidden; }
  #base {
    position: absolute; left: 50%; top: 498px; transform: translateX(-50%);
    width: 840px; height: 26px; border-radius: 4px 4px 14px 14px;
    background: linear-gradient(#2c2c2c, #151515);
  }
  #base::after {
    content: ""; position: absolute; left: 50%; top: 0; transform: translateX(-50%);
    width: 130px; height: 9px; border-radius: 0 0 10px 10px; background: #0c0c0c;
  }
  .panel {
    position: absolute; border: 1px solid var(--border); border-radius: 8px;
    background-color: #0a0a0a; background-repeat: no-repeat;
    box-shadow: 0 18px 50px rgba(0,0,0,0.65), 0 0 0 1px rgba(0,255,135,0.06);
    overflow: hidden; will-change: transform, opacity;
  }
  .panel::after {
    content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px;
    background: linear-gradient(90deg, var(--bull), transparent 60%); opacity: 0.7;
  }
  #panels { position: absolute; inset: 0; }
  #bull { position: absolute; inset: 0; }
  #bullreal {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    height: 92%; opacity: 0;
  }
  #homepage {
    position: absolute; inset: 0;
    width: 100%; height: 100%; object-fit: cover; object-position: top center;
    opacity: 0;
  }
</style>
</head>
<body>
<div id="stage">
  <div id="glow"></div>
  <div id="grid"></div>
  <div id="mac">
    <div id="screen"><div id="screen-inner"></div></div>
    <div id="base"></div>
  </div>
  <div id="panels"></div>
  <img id="homepage" alt="">
  <canvas id="bull"></canvas>
  <img id="bullreal" alt="">
  <svg id="outline" width="880" height="620" viewBox="0 0 880 620">
    <path id="outline-screen" d="M 60 20 H 820 Q 838 20 838 38 V 500 H 42 V 38 Q 42 20 60 20 Z"/>
    <path id="outline-base" d="M 10 530 H 870 Q 870 560 830 560 H 50 Q 10 560 10 530 Z"/>
  </svg>
  <div id="vignette"></div>
</div>

<script>
// ---- timeline: PHASES are RECEIVED from initScene (single source of truth =
// ACTS in lib/cinema.ts). Fallback default kept in sync for standalone opens. --
let PHASES = {
  boot: [0.00, 0.05], assembly: [0.05, 0.15], dive: [0.15, 0.24], regime: [0.24, 0.32],
  candle: [0.32, 0.59], safety: [0.59, 0.665], consensus: [0.665, 0.73], bull: [0.73, 0.84],
  matrix: [0.84, 1.00],
};

// ---- tiny deterministic helpers ------------------------------------------
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const easeIO = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
const easeOut = (t) => 1 - Math.pow(1 - t, 3);
// Crossfade envelope for a feature act: ramps in just before the act and out
// just after, overlapping the neighbours at the boundary so there is no black
// flash between acts (at a shared boundary both sit at ~0.5 → a clean dissolve).
const actEnv = (t, ph, fin = 0.02, fout = 0.024) =>
  seg(t, ph[0] - fin, ph[0] + fin) * (1 - seg(t, ph[1] - fout, ph[1] + fout));
const TAU = Math.PI * 2;
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
    let z = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    z = (z + Math.imul(z ^ (z >>> 7), 61 | z)) ^ z;
    return ((z ^ (z >>> 14)) >>> 0) / 4294967296;
  };
}
function normal(rnd) { // Box-Muller
  let u = 0, v = 0;
  while (u === 0) u = rnd();
  while (v === 0) v = rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * v);
}
// lerp between two #rrggbb hex colors
function mixHex(a, b, t) {
  const pa = [parseInt(a.slice(1, 3), 16), parseInt(a.slice(3, 5), 16), parseInt(a.slice(5, 7), 16)];
  const pb = [parseInt(b.slice(1, 3), 16), parseInt(b.slice(3, 5), 16), parseInt(b.slice(5, 7), 16)];
  const c = pa.map((x, i) => Math.round(lerp(x, pb[i], clamp(t, 0, 1))));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}
// PALETTE + TYPEFACE — both RECEIVED from the parent via initScene, never
// re-declared here. This copy had already drifted: RED was #ff5c5c against the
// site's --bear #ff2e63, and AMBER #ffb020 against --ffb800, so the film's
// crash was a different red from the product's. And every ctx.font asked for
// `ui-monospace`, i.e. whatever the operating system happens to supply — the
// nine-act showpiece was typeset in Menlo on a Mac, Consolas on Windows and
// DejaVu on Linux. MONO is the parent's own JetBrains Mono face, injected into
// this document as an @font-face by ScrollCinema before initScene runs.
let GREEN = "#00ff87", RED = "#ff2e63", CYAN = "#00e5ff", AMBER = "#ffb800", INK = "#f5f5f0", GRAY = "#8a8a82";
let MONO = "ui-monospace, SFMono-Regular, Menlo, monospace";
// alpha wrapper that accepts either #rrggbb or rgb(...) so fills never break
function withAlpha(c, a) {
  if (c[0] === "#") {
    const r = parseInt(c.slice(1, 3), 16), g = parseInt(c.slice(3, 5), 16), b = parseInt(c.slice(5, 7), 16);
    return `rgba(${r},${g},${b},${a})`;
  }
  return c.replace("rgb(", "rgba(").replace(")", `,${a})`);
}

// ---- panels (each a distinct app screen) ---------------------------------
const PANEL_DEFS = [
  { shot: "chain", dive: [-1.0, -0.4] }, { shot: "trade", dive: [ 1.0, -0.3] },
  { shot: "learn", dive: [-0.7,  0.8] }, { shot: "quant", dive: [ 0.8,  0.7] },
  { shot: "pro",   dive: [-1.2,  0.1] }, { shot: "chain", dive: [ 1.2,  0.2] },
  { shot: "bots",  dive: [-0.4, -1.0] }, { shot: "about", dive: [ 0.4,  1.1] },
  { shot: "quant", dive: [ 0.2, -1.2] },
];
const START_POSES = [
  { x: -0.55, y: -0.35, r: -24 }, { x: 0.0,  y: -0.62, r: 10 }, { x: 0.55, y: -0.38, r: 22 },
  { x: -0.68, y:  0.05, r: -14 }, { x: 0.7,  y:  0.02, r: 16 }, { x: -0.5, y:  0.42, r: -20 },
  { x:  0.0,  y:  0.6,  r:  8 },  { x: 0.52, y:  0.44, r: 18 }, { x: -0.2, y: -0.55, r: -6 },
];

// ---- bull-head silhouette -------------------------------------------------
const BULL_HALF = [
  [0.05, 0.30], [0.14, 0.24], [0.24, 0.20], [0.42, 0.12], [0.62, 0.04],
  [0.44, 0.21], [0.31, 0.27], [0.32, 0.36], [0.36, 0.46],
  [0.30, 0.58], [0.23, 0.71], [0.17, 0.81], [0.10, 0.90], [0.03, 0.95],
];
function bullOutline() {
  const right = BULL_HALF;
  const left = [...BULL_HALF].reverse().map(([x, y]) => [-x, y]);
  return right.concat(left);
}

// The rain speaks the product's own language. This used to be the mirrored
// half-width katakana set from a 1997 film — the single most exhausted visual
// in the genre, and an odd thing for a site that renders its own live cinema to
// borrow. Greeks, strikes, calls and puts are what this instrument is actually
// made of, and they are glyphs a reader can half-recognise rather than set
// dressing. Count is kept in the same 40-60 band so the fall maths is untouched.
const MATRIX_CHARS =
  "ΔΓΘΛΣΩνρσμβα0123456789.+-=<>/|$%CPKS∂π".split("");

// 12 bots for the consensus ring — real families/verdicts from the app.
// 10 agree (up>0.6), 2 dissent — a realistic ULTRA majority, not unanimity.
const BOTS = [
  { k: "SMA", fam: "trend", up: 0.86 }, { k: "MACD", fam: "trend", up: 0.80 },
  { k: "RSI", fam: "trend", up: 0.43 }, { k: "BOLL", fam: "trend", up: 0.78 },
  { k: "DON", fam: "trend", up: 0.83 }, { k: "Z", fam: "stats", up: 0.64 },
  { k: "KAL", fam: "stats", up: 0.70 }, { k: "LR", fam: "stats", up: 0.67 },
  { k: "DIR", fam: "ai", up: 0.88 }, { k: "MAG", fam: "ai", up: 0.74 },
  { k: "CNN", fam: "ai", up: 0.41 }, { k: "TXR", fam: "ai", up: 0.82 },
];
const FAM_COLOR = { trend: GREEN, stats: CYAN, ai: RED };

// ---- scene state -----------------------------------------------------------
let CFG = null, PARTICLES = [], BULL_IMGS = [], MATRIX = [], MATRIX_CELL = 16;
let NOW = 0; // ambient time (seconds) set by renderAt — drives always-on motion
let DRAW_T0 = null; // when the loader revealed → the laptop draw-on starts
let CHART = null;      // shared chart rect { x, y, w, h }
let REGIME = null;     // { incr: number[] }
let CANDLES = null;    // { bars:[{x,oy,cy,hy,ly,bw,up,crash}], ai:[{x,y}], cone:[{x,uy,ly}], diverge, spot:[] }
let PAYOFF = null;     // { pts:[{x,y}], zeroY, lossY, beX, maxLossX }
let RING = null;       // { cx, cy, r, nodes:[{a,x,y,col,up,k}] }

function computeChart(W, H) {
  // lower-center so the feature-act copy (top third) never overlaps the chart
  CHART = { x: W * 0.11, y: H * 0.34, w: W * 0.78, h: H * 0.46 };
}

// Two reference paths the regime act blends between: a mean-reverting "choppy"
// walk (low Hurst) and a smooth "trend" (high Hurst). Blending makes the three
// regimes read distinctly as the Hurst dial rises.
function buildRegime() {
  const rnd = mulberry32(4242), n = 140;
  const choppy = [], trend = [];
  let cv = 0, tv = 0;
  for (let i = 0; i < n; i++) {
    cv = cv * 0.55 + (rnd() - 0.5) * 2.4; // OU-ish: pulled back to 0 → oscillates
    choppy.push(cv);
    tv += 0.5 + (rnd() - 0.5) * 0.55;      // persistent climb with light noise
    trend.push(tv);
  }
  REGIME = { choppy, trend, n };
}

// Deterministic GBM candle series: climb → crash → stabilize, plus an AI
// forecast line + cone that bends DOWN before the crash and that the crash
// then falls into. All pixel geometry mapped to the shared CHART rect.
function buildCandles() {
  const ch = CHART, N = 90, DIVERGE = 52, CRASH = 64, END_CRASH = 82, dt = 1 / 52; // AI diverges 12 bars before the crash
  const rnd = mulberry32(7);
  let price = 100;
  const raw = [];
  for (let i = 0; i < N; i++) {
    let mu, sig;
    if (i < CRASH) { mu = 1.05; sig = 0.85; }          // euphoric climb
    else if (i < END_CRASH) { mu = -3.6; sig = 2.1; }  // the crash
    else { mu = 0.15; sig = 0.7; }                      // stabilize tail
    const o = price;
    price = price * Math.exp((mu - 0.5 * sig * sig) * dt + sig * Math.sqrt(dt) * normal(rnd));
    const c = price;
    const hi = Math.max(o, c), lo = Math.min(o, c);
    const wick = (0.25 + rnd() * 0.6) * Math.abs(c - o) + o * 0.0015;
    raw.push({ o, c, h: hi + wick, l: lo - wick, up: c >= o, crash: i >= CRASH && i < END_CRASH });
  }
  // AI forecast: tracks close through DIVERGE, then bends down toward the crash low.
  let crashLow = Infinity;
  for (let i = CRASH; i < N; i++) crashLow = Math.min(crashLow, raw[i].l);
  const ai = [];
  const slope = (raw[DIVERGE].c - crashLow) / (END_CRASH - 2 - DIVERGE);
  for (let i = 0; i < N; i++) {
    if (i <= DIVERGE) ai.push(raw[i].c);
    else ai.push(Math.max(crashLow, raw[DIVERGE].c - (i - DIVERGE) * slope));
  }
  // price range for pixel mapping (pad a little)
  let pmin = Infinity, pmax = -Infinity;
  for (const b of raw) { pmin = Math.min(pmin, b.l); pmax = Math.max(pmax, b.h); }
  const pad = (pmax - pmin) * 0.08; pmin -= pad; pmax += pad;
  const yOf = (p) => ch.y + ch.h * (1 - (p - pmin) / (pmax - pmin));
  const xOf = (i) => ch.x + (i + 0.5) * (ch.w / N);
  const bw = Math.max(2, (ch.w / N) * 0.6);
  const bars = raw.map((b, i) => ({
    x: xOf(i), oy: yOf(b.o), cy: yOf(b.c), hy: yOf(b.h), ly: yOf(b.l), bw, up: b.up, crash: b.crash,
  }));
  const aiPx = ai.map((v, i) => ({ x: xOf(i), y: yOf(v) }));
  // widening cone around the AI line, from DIVERGE onward
  const cone = [];
  for (let i = DIVERGE; i < N; i++) {
    const w = (i - DIVERGE) * (pmax - pmin) * 0.010 + (pmax - pmin) * 0.008;
    cone.push({ x: xOf(i), uy: yOf(ai[i] + w), ly: yOf(ai[i] - w) });
  }
  CANDLES = { bars, ai: aiPx, cone, diverge: DIVERGE, crash: CRASH, endCrash: END_CRASH, N, spot: raw.map((b) => b.c) };
}

// Bull Call Spread payoff: flat max-loss floor → ramp → flat max-profit ceiling.
function buildPayoff() {
  const ch = CHART;
  const maxLoss = -80, maxProfit = 420, k1 = 0.30, k2 = 0.62; // ramp between 30%-62% of width
  const yOf = (v) => ch.y + ch.h * (1 - (v - maxLoss) / (maxProfit - maxLoss));
  const xOf = (u) => ch.x + u * ch.w;
  const pts = [
    { u: 0, v: maxLoss }, { u: k1, v: maxLoss }, { u: k2, v: maxProfit }, { u: 1, v: maxProfit },
  ].map((p) => ({ x: xOf(p.u), y: yOf(p.v) }));
  const beU = k1 + (k2 - k1) * (0 - maxLoss) / (maxProfit - maxLoss); // where payoff crosses 0
  PAYOFF = { pts, zeroY: yOf(0), lossY: yOf(maxLoss), profY: yOf(maxProfit), beX: xOf(beU), floorX0: xOf(0), floorX1: xOf(k1), maxLoss, maxProfit };
}

function buildRing(W, H) {
  const cx = W / 2, cy = H * 0.56, r = Math.min(W, H) * 0.25;
  const nodes = BOTS.map((b, i) => {
    const a = -Math.PI / 2 + (i / BOTS.length) * TAU;
    return { a, x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r, col: FAM_COLOR[b.fam], up: b.up, k: b.k };
  });
  RING = { cx, cy, r, nodes };
}

window.initScene = async function initScene(cfg) {
  CFG = cfg;
  // Adopt the parent's resolved design tokens and mono face, so this scene can
  // never drift from the site again.
  if (cfg.tokens) {
    const t = cfg.tokens;
    if (t.bull) GREEN = t.bull;
    if (t.bear) RED = t.bear;
    if (t.cyan) CYAN = t.cyan;
    if (t.amber) AMBER = t.amber;
    if (t.fg) INK = t.fg;
    if (t.fgDim) GRAY = t.fgDim;
    const rs = document.documentElement.style;
    for (const [k, v] of Object.entries({
      "--bull": t.bull, "--bear": t.bear, "--cyan": t.cyan,
      "--amber": t.amber, "--fg": t.fg, "--fg-dim": t.fgDim, "--bg": t.bg,
    })) if (v) rs.setProperty(k, v);
  }
  if (cfg.mono) {
    MONO = cfg.mono;
    // Canvas does NOT trigger a webfont fetch: setting ctx.font to a family that
    // has not loaded silently falls back, and `document.fonts.ready` resolves
    // happily because nothing in this DOM references the face. Ask for it
    // explicitly, then let the existing fonts.ready await below settle.
    try { await document.fonts.load(`700 24px ${MONO}`); } catch { /* fallback stands */ }
  }
  if (cfg.phases) {
    PHASES = {};
    for (const k in cfg.phases) PHASES[k] = [cfg.phases[k].from, cfg.phases[k].to];
  }
  const stage = document.getElementById("stage");
  const W = stage.clientWidth, H = stage.clientHeight;
  // Bail on an unlaid-out / collapsed 0-size stage: keep any prior geometry and
  // let the next resize re-init at a real size (avoids NaN chart mapping).
  if (W < 2 || H < 2) return true;
  STROKES = null; // re-measure the boot outline lengths on every (re)init

  // Panels ×2 (grid inside the mac + fly layer).
  const inner = document.getElementById("screen-inner");
  const fly = document.getElementById("panels");
  inner.innerHTML = ""; fly.innerHTML = "";
  PANEL_DEFS.forEach((def, i) => {
    for (const [parent, cls] of [[inner, "grid"], [fly, "fly"]]) {
      const el = document.createElement("div");
      el.className = "panel " + cls;
      el.dataset.i = String(i);
      el.style.backgroundImage = `url(${CFG.shots[def.shot]})`;
      el.style.backgroundSize = "cover";
      el.style.backgroundPosition = "top center";
      parent.appendChild(el);
    }
  });
  document.querySelectorAll("#screen-inner .panel").forEach((el, i) => {
    const col = i % 3, row = Math.floor(i / 3);
    el.style.width = "236px"; el.style.height = "142px";
    el.style.left = `${8 + col * 246}px`; el.style.top = `${8 + row * 152}px`;
  });
  document.querySelectorAll("#panels .panel").forEach((el) => {
    el.style.width = `${Math.round(W * 0.28)}px`;
    el.style.height = `${Math.round(W * 0.17)}px`;
    el.style.left = "50%"; el.style.top = "50%";
  });

  // Bull particles.
  const rnd = mulberry32(1337);
  const outline = bullOutline();
  const cx = W / 2, cy = H * 0.5, scale = Math.min(W, H) * 0.36;
  PARTICLES = [];
  for (let i = 0; i < 1200; i++) {
    const u = i / 1200, fi = u * (outline.length - 1), k = Math.floor(fi), fr = fi - k;
    const a = outline[k], b = outline[Math.min(k + 1, outline.length - 1)];
    const jx = (rnd() - 0.5) * 0.05, jy = (rnd() - 0.5) * 0.05;
    PARTICLES.push({
      sx: rnd() * W, sy: rnd() * H,
      tx: cx + (lerp(a[0], b[0], fr) + jx) * scale,
      ty: cy + (lerp(a[1], b[1], fr) + jy - 0.5) * scale * 1.15,
      tint: rnd(), size: rnd() < 0.25 ? 3 : 2, glow: i % 4 === 0,
    });
  }
  const bullCanvas = document.getElementById("bull");
  bullCanvas.width = W; bullCanvas.height = H;

  // Matrix rain columns.
  MATRIX_CELL = Math.max(13, Math.round(W / 96));
  const cols = Math.floor(W / MATRIX_CELL);
  const rnd2 = mulberry32(90210);
  MATRIX = [];
  for (let c = 0; c < cols; c++) {
    MATRIX.push({
      x: c * MATRIX_CELL + MATRIX_CELL * 0.1, phase: rnd2(),
      speed: 0.55 + rnd2() * 1.1, len: 9 + Math.floor(rnd2() * 18), lead: Math.floor(rnd2() * 9973),
    });
  }

  // Precompute feature-act geometry (size dependent → recomputed on resize).
  computeChart(W, H);
  buildRegime();
  buildCandles();
  buildPayoff();
  buildRing(W, H);

  document.getElementById("homepage").src = CFG.shots.hero || CFG.shots.home;

  const urls = Object.values(CFG.shots);
  if (CFG.bullFrames && CFG.bullFrames.length) {
    BULL_IMGS = CFG.bullFrames.map((u) => { const im = new Image(); im.src = u; return im; });
    urls.push(...CFG.bullFrames);
  }
  await Promise.all(urls.map((u) => new Promise((res) => {
    const im = new Image(); im.onload = res; im.onerror = res; im.src = u;
  })));
  document.fonts && (await document.fonts.ready);
  return true;
};

let STROKES = null;
function strokes() {
  if (!STROKES) {
    STROKES = ["outline-screen", "outline-base"].map((id) => {
      const p = document.getElementById(id);
      return { p, len: p.getTotalLength() };
    });
    STROKES.forEach(({ p, len }) => { p.style.strokeDasharray = String(len); });
  }
  return STROKES;
}

// ================= ACT RENDERERS (canvas) =================================

// Act: regime — a price path morphs trend↔reversion↔noise and recolors.
function drawRegime(ctx, r, env, W, H) {
  const ch = CHART, alpha = env;
  if (alpha <= 0.001) return;
  const H_ex = lerp(0.36, 0.66, easeIO(r)); // Hurst rises: reversion → noise → trend
  const blend = easeIO(r);
  const n = REGIME.n;
  // blend the choppy and trend reference paths
  const ys = []; let vmin = 1e9, vmax = -1e9;
  for (let i = 0; i < n; i++) {
    const v = lerp(REGIME.choppy[i], REGIME.trend[i], blend);
    ys.push(v); if (v < vmin) vmin = v; if (v > vmax) vmax = v;
  }
  const span = Math.max(1e-6, vmax - vmin);
  const xOf = (i) => ch.x + (i / (n - 1)) * ch.w;
  const yOf = (val) => ch.y + ch.h * (1 - (val - vmin) / span);
  // color by regime: cyan (revert) → gray (random) → green (trend)
  const col = H_ex < 0.47 ? mixHex(GRAY, CYAN, seg(0.47 - H_ex, 0, 0.11))
    : H_ex > 0.53 ? mixHex(GRAY, GREEN, seg(H_ex - 0.53, 0, 0.13))
    : GRAY;
  ctx.save(); ctx.globalAlpha = alpha;
  // fill under curve
  const grad = ctx.createLinearGradient(0, ch.y, 0, ch.y + ch.h);
  grad.addColorStop(0, withAlpha(col, 0.16));
  grad.addColorStop(1, "rgba(0,0,0,0)");
  ctx.beginPath(); ctx.moveTo(xOf(0), yOf(ys[0]));
  for (let i = 1; i < n; i++) ctx.lineTo(xOf(i), yOf(ys[i]));
  ctx.lineTo(xOf(n - 1), ch.y + ch.h); ctx.lineTo(xOf(0), ch.y + ch.h); ctx.closePath();
  ctx.fillStyle = grad; ctx.fill();
  // stroke
  ctx.beginPath(); ctx.moveTo(xOf(0), yOf(ys[0]));
  for (let i = 1; i < n; i++) ctx.lineTo(xOf(i), yOf(ys[i]));
  ctx.strokeStyle = col; ctx.lineWidth = 2.2; ctx.shadowBlur = 10; ctx.shadowColor = col; ctx.stroke();
  ctx.shadowBlur = 0;
  // regime meter (bottom): a needle riding 0..1 at H, with the detected regime
  // name and what the platform would run for it (real Hurst → bot mapping).
  const my = ch.y + ch.h + Math.min(44, H * 0.055), mx0 = ch.x + ch.w * 0.30, mw = ch.w * 0.40;
  ctx.strokeStyle = "rgba(245,245,240,0.22)"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(mx0, my); ctx.lineTo(mx0 + mw, my); ctx.stroke();
  const nx = mx0 + mw * seg(H_ex, 0.34, 0.68);
  ctx.fillStyle = col; ctx.fillRect(nx - 1.5, my - 7, 3, 14);
  const name = H_ex > 0.56 ? "TRENDING" : H_ex < 0.44 ? "MEAN-REVERTING" : "RANDOM WALK";
  const rec = H_ex > 0.56 ? "run trend bots · SMA · MACD · Donchian"
    : H_ex < 0.44 ? "run reversion · Z-Score · Kalman" : "no edge — stand aside";
  ctx.textAlign = "center"; ctx.textBaseline = "top";
  ctx.fillStyle = col; ctx.font = `700 ${Math.round(H * 0.024)}px ${MONO}`;
  ctx.fillText(`H ${H_ex.toFixed(2)}  ·  ${name}`, W / 2, my + 14);
  ctx.fillStyle = GRAY; ctx.font = `${Math.round(H * 0.016)}px ${MONO}`;
  ctx.fillText(rec, W / 2, my + 14 + H * 0.032);
  ctx.textAlign = "left";
  ctx.restore();
}

function drawCandleBody(ctx, c, alpha, grow, hot) {
  const col = c.up ? GREEN : RED;
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = col; ctx.fillStyle = col;
  ctx.lineWidth = Math.max(1, c.bw * 0.16);
  if (hot) { ctx.shadowBlur = 10; ctx.shadowColor = col; }
  ctx.beginPath(); ctx.moveTo(c.x, c.hy); ctx.lineTo(c.x, c.ly); ctx.stroke();
  const top = Math.min(c.oy, c.cy), full = Math.max(2, Math.abs(c.cy - c.oy));
  const h = full * grow, mid = (c.oy + c.cy) / 2;
  ctx.fillRect(c.x - c.bw / 2, mid - h / 2, c.bw, h);
  ctx.shadowBlur = 0;
}

// Act: candle — the signature. Climb → AI predicts down → crash into the cone.
function drawCandle(ctx, p, env, W, H) {
  const ch = CHART, C = CANDLES;
  const chartAlpha = env;
  if (chartAlpha <= 0.001) return;
  // gentle pull-back "zoom out"
  const zoom = lerp(1.14, 1.0, easeOut(seg(p, 0, 0.20)));
  ctx.save();
  const cxp = ch.x + ch.w * 0.5, cyp = ch.y + ch.h * 0.5;
  ctx.translate(cxp, cyp); ctx.scale(zoom, zoom); ctx.translate(-cxp, -cyp);
  ctx.globalAlpha = chartAlpha;

  // faint chart gridlines + baseline
  ctx.strokeStyle = "rgba(245,245,240,0.06)"; ctx.lineWidth = 1;
  for (let g = 0; g <= 4; g++) {
    const gy = ch.y + (g / 4) * ch.h;
    ctx.beginPath(); ctx.moveTo(ch.x, gy); ctx.lineTo(ch.x + ch.w, gy); ctx.stroke();
  }

  // how many candles are revealed (climb then crash). Climb starts immediately
  // so the act never opens on a blank chart.
  const climbN = Math.round(easeOut(seg(p, 0.03, 0.40)) * C.crash);
  const crashN = Math.round(easeOut(seg(p, 0.46, 0.72)) * (C.N - C.crash));
  const revealed = p < 0.46 ? climbN : C.crash + crashN;

  // prediction cone + AI line appear DURING the climb (foresight before fear),
  // fully drawn and held through p≈0.40-0.46 before the crash starts.
  const predA = seg(p, 0.24, 0.40) * (1 - seg(p, 0.88, 0.97)) * chartAlpha;
  const predReveal = easeOut(seg(p, 0.24, 0.60)); // how far the forecast has drawn
  if (predA > 0.002) {
    const cone = C.cone, cn = Math.max(2, Math.round(cone.length * predReveal));
    // cone fill
    ctx.globalAlpha = predA * 0.5;
    ctx.beginPath(); ctx.moveTo(cone[0].x, cone[0].uy);
    for (let i = 1; i < cn; i++) ctx.lineTo(cone[i].x, cone[i].uy);
    for (let i = cn - 1; i >= 0; i--) ctx.lineTo(cone[i].x, cone[i].ly);
    ctx.closePath();
    ctx.fillStyle = "rgba(0,229,255,0.10)"; ctx.fill();
    // dashed AI forecast line (cyan → amber toward the crash)
    ctx.globalAlpha = predA;
    ctx.setLineDash([6, 5]); ctx.lineWidth = 2;
    const dEnd = Math.min(C.N - 1, C.diverge + Math.round((C.N - 1 - C.diverge) * predReveal));
    ctx.beginPath();
    for (let i = C.diverge; i <= dEnd; i++) {
      const q = (i - C.diverge) / Math.max(1, C.N - 1 - C.diverge);
      if (i === C.diverge) ctx.moveTo(C.ai[i].x, C.ai[i].y); else ctx.lineTo(C.ai[i].x, C.ai[i].y);
    }
    ctx.strokeStyle = mixHex(CYAN, AMBER, predReveal); ctx.shadowBlur = 8; ctx.shadowColor = CYAN;
    ctx.stroke(); ctx.setLineDash([]); ctx.shadowBlur = 0;
    // pulsing marker at the divergence point
    const dv = C.ai[C.diverge];
    const pulse = 3 + 2 * (0.5 + 0.5 * Math.sin(seg(p, 0.28, 0.62) * TAU * 2));
    ctx.globalAlpha = predA; ctx.fillStyle = AMBER; ctx.beginPath();
    ctx.arc(dv.x, dv.y, pulse, 0, TAU); ctx.fill();
    // anchor the probability figure to the forecast so the copy's "71%" is on-chart
    ctx.globalAlpha = predA; ctx.fillStyle = AMBER;
    ctx.font = `600 ${Math.round(H * 0.019)}px ${MONO}`;
    ctx.textAlign = "left"; ctx.textBaseline = "bottom";
    ctx.fillText("P(down) 71%", dv.x + 13, dv.y - 9);
    ctx.textBaseline = "top";
  }

  // candles
  for (let i = 0; i < revealed; i++) {
    const c = C.bars[i];
    // each candle pops in over its own little sub-window near the reveal edge
    const grow = i < revealed - 1 ? 1 : easeOut(clamp((p < 0.46 ? seg(p, 0.03, 0.40) * C.crash : C.crash + seg(p, 0.46, 0.72) * (C.N - C.crash)) - i, 0, 1));
    const hot = i >= revealed - 2; // leading edge glows
    drawCandleBody(ctx, c, chartAlpha, grow, hot);
  }

  // crash screen-shake (deterministic, decays) — applied as a subtle offset
  // handled by re-drawing? keep cheap: a red vignette pulse during the crash.
  const crashHeat = seg(p, 0.48, 0.56) * (1 - seg(p, 0.74, 0.86));
  if (crashHeat > 0.01) {
    const g = ctx.createRadialGradient(W / 2, H * 0.5, H * 0.2, W / 2, H * 0.5, W * 0.62);
    g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, `rgba(255,60,60,${0.16 * crashHeat})`);
    ctx.globalAlpha = 1; ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }

  // vindication: draw a check where the crash meets the AI line
  const vind = seg(p, 0.70, 0.88) * chartAlpha;
  if (vind > 0.02) {
    const meet = C.ai[Math.min(C.N - 1, C.endCrash - 2)];
    ctx.globalAlpha = vind; ctx.strokeStyle = GREEN; ctx.lineWidth = 3;
    ctx.shadowBlur = 10; ctx.shadowColor = GREEN;
    ctx.beginPath();
    ctx.arc(meet.x, meet.y, 16, 0, TAU); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(meet.x - 7, meet.y); ctx.lineTo(meet.x - 1, meet.y + 6); ctx.lineTo(meet.x + 8, meet.y - 7); ctx.stroke();
    ctx.shadowBlur = 0;
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

// Act: safety — the capped payoff diagram (defined risk + kill switch).
function drawSafety(ctx, q, env, W, H) {
  const ch = CHART, P = PAYOFF, alpha = env;
  if (alpha <= 0.001) return;
  const draw = easeOut(seg(q, 0.0, 0.45)); // payoff strokes left→right
  ctx.save(); ctx.globalAlpha = alpha;
  // zero line
  ctx.strokeStyle = "rgba(245,245,240,0.14)"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(ch.x, P.zeroY); ctx.lineTo(ch.x + ch.w, P.zeroY); ctx.stroke();
  // reveal x
  const revealX = ch.x + ch.w * draw;
  // build clipped polyline path
  const pts = P.pts;
  function pathTo(xLimit) {
    ctx.beginPath();
    let started = false, prev = null;
    for (const pt of pts) {
      if (!started) { ctx.moveTo(pt.x, pt.y); started = true; prev = pt; continue; }
      if (pt.x <= xLimit) { ctx.lineTo(pt.x, pt.y); prev = pt; }
      else {
        const tt = (xLimit - prev.x) / (pt.x - prev.x);
        if (tt > 0) ctx.lineTo(xLimit, lerp(prev.y, pt.y, clamp(tt, 0, 1)));
        break;
      }
    }
  }
  // fills: below-zero red, above-zero green (clipped to reveal)
  ctx.save();
  ctx.beginPath(); ctx.rect(ch.x, ch.y, ch.w * draw, ch.h); ctx.clip();
  // green fill above zero
  ctx.beginPath(); ctx.moveTo(pts[0].x, P.zeroY);
  for (const pt of pts) ctx.lineTo(pt.x, pt.y);
  ctx.lineTo(pts[pts.length - 1].x, P.zeroY); ctx.closePath();
  ctx.fillStyle = "rgba(0,255,135,0.10)"; ctx.fill();
  ctx.restore();
  // the payoff line
  pathTo(revealX);
  ctx.strokeStyle = GREEN; ctx.lineWidth = 2.6; ctx.shadowBlur = 10; ctx.shadowColor = GREEN; ctx.stroke();
  ctx.shadowBlur = 0;
  // laser tip riding the reveal front — the payoff is being cut, not faded in
  if (draw > 0.05 && draw < 0.99) {
    const yAt = (x) => { // same interpolation pathTo uses
      if (x <= pts[0].x) return pts[0].y;
      for (let i = 1; i < pts.length; i++) {
        if (x <= pts[i].x) {
          const tt = (x - pts[i - 1].x) / Math.max(1e-6, pts[i].x - pts[i - 1].x);
          return lerp(pts[i - 1].y, pts[i].y, tt);
        }
      }
      return pts[pts.length - 1].y;
    };
    ctx.fillStyle = "rgba(220,255,238,0.95)";
    ctx.shadowBlur = 14; ctx.shadowColor = GREEN;
    ctx.beginPath(); ctx.arc(revealX, yAt(revealX), 3.5, 0, TAU); ctx.fill();
    ctx.shadowBlur = 0;
    for (const [dx, ta] of [[-8, 0.5], [-18, 0.3], [-30, 0.15]]) {
      const tx = revealX + dx;
      if (tx < pts[0].x) continue;
      ctx.globalAlpha = alpha * ta;
      ctx.beginPath(); ctx.arc(tx, yAt(tx), 2.2, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = alpha;
  }
  // max-loss guard line
  const guard = seg(q, 0.32, 0.6) * alpha;
  if (guard > 0.02) {
    ctx.globalAlpha = guard; ctx.strokeStyle = RED; ctx.setLineDash([7, 5]); ctx.lineWidth = 1.6;
    ctx.lineDashOffset = -((NOW * 22) % 12); // marching ants — the guard is live
    ctx.beginPath(); ctx.moveTo(ch.x, P.lossY); ctx.lineTo(ch.x + ch.w, P.lossY); ctx.stroke();
    ctx.setLineDash([]); ctx.lineDashOffset = 0;
    ctx.fillStyle = RED; ctx.font = `600 ${Math.round(H * 0.02)}px ${MONO}`;
    ctx.textBaseline = "bottom"; ctx.fillText("−$80  max loss", ch.x + 6, P.lossY - 6);
  }
  // red leak: risk dripping out below the floor — the guard is what holds it
  if (guard > 0.05) {
    ctx.fillStyle = RED;
    for (let i = 0; i < 10; i++) {
      const px_ = ch.x + ((i * 0.104 + 0.03) % 1) * ch.w;
      const f = ((NOW * 0.25 + i * 0.13) % 1);
      ctx.globalAlpha = guard * (1 - f) * 0.5;
      ctx.beginPath(); ctx.arc(px_, P.lossY + f * 28, 1.6, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = alpha;
  }
  // breakeven vertical
  const be = seg(q, 0.4, 0.66) * alpha;
  if (be > 0.02) {
    ctx.globalAlpha = be; ctx.strokeStyle = CYAN; ctx.setLineDash([4, 5]); ctx.lineWidth = 1.4;
    ctx.lineDashOffset = -((NOW * 16) % 9);
    ctx.beginPath(); ctx.moveTo(P.beX, ch.y); ctx.lineTo(P.beX, ch.y + ch.h); ctx.stroke(); ctx.setLineDash([]);
    ctx.lineDashOffset = 0;
  }
  // kill-switch armed glow + badge
  const kill = seg(q, 0.55, 0.85) * alpha;
  if (kill > 0.02) {
    const g = ctx.createRadialGradient(W / 2, P.lossY, 10, W / 2, P.lossY, W * 0.34);
    g.addColorStop(0, `rgba(0,255,135,${0.14 * kill})`); g.addColorStop(1, "rgba(0,255,135,0)");
    ctx.globalAlpha = 1; ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = kill; ctx.fillStyle = GREEN;
    const bx = ch.x + ch.w - 172, by = ch.y + 8;
    ctx.beginPath(); ctx.arc(bx + 8, by + 9, 4, 0, TAU); ctx.fill();
    ctx.font = `600 ${Math.round(H * 0.019)}px ${MONO}`; ctx.textBaseline = "top";
    ctx.fillStyle = "rgba(0,255,135,0.9)"; ctx.fillText("KILL SWITCH ARMED", bx + 20, by + 1);
  }
  ctx.restore();
}

// Act: consensus — 12 bots vote on a ring; a tally arc climbs to a tier.
function drawConsensus(ctx, v, env, W, H) {
  const R = RING, alpha = env;
  if (alpha <= 0.001) return;
  ctx.save(); ctx.globalAlpha = alpha;
  // agreement grows: how many bots have "cast" and how strongly they agree BUY
  let agree = 0;
  R.nodes.forEach((nd, i) => {
    const cast = easeOut(seg(v, 0.08 + i * 0.03, 0.5 + i * 0.02));
    const strength = (nd.up - 0.5) * 2; // ~0.28..0.76 conviction
    const len = R.r * lerp(0.12, 0.99, cast) * (0.55 + strength * 0.45);
    // spoke
    ctx.strokeStyle = nd.col; ctx.globalAlpha = alpha * (0.35 + 0.5 * cast);
    ctx.lineWidth = 2; ctx.beginPath();
    ctx.moveTo(R.cx, R.cy);
    ctx.lineTo(R.cx + Math.cos(nd.a) * len, R.cy + Math.sin(nd.a) * len);
    ctx.stroke();
    // node
    const lit = cast > 0.5 && nd.up > 0.6;
    ctx.globalAlpha = alpha * (0.4 + 0.6 * cast);
    ctx.fillStyle = nd.col; ctx.shadowBlur = lit ? 10 + 5 * Math.sin(NOW * 2.4 + i * 1.7) : 0; ctx.shadowColor = nd.col;
    ctx.beginPath(); ctx.arc(nd.x, nd.y, lit ? 6 + 0.8 * Math.sin(NOW * 2.4 + i * 1.7) : 4, 0, TAU); ctx.fill(); ctx.shadowBlur = 0;
    // energy pulses: committed bots feed the verdict — 2 sparks per spoke, inward
    if (cast > 0.55) {
      for (let k = 0; k < 2; k++) {
        const f = ((NOW * 0.55 + i * 0.171 + k * 0.5) % 1);
        ctx.globalAlpha = alpha * (1 - f) * 0.9 * cast;
        ctx.fillStyle = nd.col; ctx.shadowBlur = 8; ctx.shadowColor = nd.col;
        ctx.beginPath();
        ctx.arc(lerp(nd.x, R.cx, f), lerp(nd.y, R.cy, f), 2.5, 0, TAU); ctx.fill();
        ctx.shadowBlur = 0;
      }
    }
    if (nd.up > 0.6 && cast > 0.7) agree += 1;
    // label
    ctx.globalAlpha = alpha * cast * 0.8; ctx.fillStyle = GRAY;
    ctx.font = `${Math.round(H * 0.014)}px ${MONO}`;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(nd.k, R.cx + Math.cos(nd.a) * (R.r + 18), R.cy + Math.sin(nd.a) * (R.r + 18));
  });
  ctx.textAlign = "left";
  // central tally arc
  const pct = (agree / R.nodes.length);
  const arcT = easeOut(seg(v, 0.2, 0.85)) * pct;
  // center charge glow: the verdict accumulating energy behind the tally
  const chgA = Math.max(0, 0.05 + 0.10 * arcT + 0.05 * Math.sin(NOW * 3));
  const cg = ctx.createRadialGradient(R.cx, R.cy, 0, R.cx, R.cy, R.r * 0.40);
  cg.addColorStop(0, `rgba(0,255,135,${chgA})`);
  cg.addColorStop(1, "rgba(0,255,135,0)");
  ctx.globalAlpha = alpha; ctx.fillStyle = cg;
  ctx.beginPath(); ctx.arc(R.cx, R.cy, R.r * 0.40, 0, TAU); ctx.fill();
  ctx.lineWidth = 6; ctx.strokeStyle = "rgba(245,245,240,0.10)";
  ctx.beginPath(); ctx.arc(R.cx, R.cy, R.r * 0.42, 0, TAU); ctx.stroke();
  ctx.strokeStyle = GREEN; ctx.shadowBlur = 12; ctx.shadowColor = GREEN;
  ctx.beginPath(); ctx.arc(R.cx, R.cy, R.r * 0.42, -Math.PI / 2, -Math.PI / 2 + TAU * arcT); ctx.stroke();
  ctx.shadowBlur = 0;
  // radar sweep: a soft arc orbiting the ring — the ensemble is always scanning
  const sweep = (NOW * 0.9) % TAU;
  ctx.globalAlpha = alpha * 0.45; ctx.lineWidth = 2.2; ctx.strokeStyle = "rgba(0,255,135,0.55)";
  ctx.shadowBlur = 8; ctx.shadowColor = GREEN;
  ctx.beginPath(); ctx.arc(R.cx, R.cy, R.r * 0.42 + 8, sweep, sweep + 0.65); ctx.stroke();
  ctx.shadowBlur = 0; ctx.globalAlpha = alpha;
  // tier text
  const shown = Math.round(arcT * R.nodes.length);
  const tierPct = shown / R.nodes.length;
  const tier = tierPct >= 0.83 ? "ULTRA" : tierPct >= 0.7 ? "HIGH" : tierPct >= 0.55 ? "MEDIUM" : "SPLIT";
  ctx.fillStyle = INK; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.font = `700 ${Math.round(H * 0.05)}px ${MONO}`;
  ctx.fillText(`${shown}/${R.nodes.length}`, R.cx, R.cy - H * 0.008);
  ctx.font = `600 ${Math.round(H * 0.02)}px ${MONO}`;
  ctx.fillStyle = tier === "ULTRA" ? GREEN : GRAY;
  ctx.fillText(tier, R.cx, R.cy + H * 0.03);
  ctx.textAlign = "left";
  // verdict flash: the lock-in moment — pure f(v) so it scrubs both ways
  const fl = seg(v, 0.86, 0.93) * (1 - seg(v, 0.93, 1.0));
  if (fl > 0.01) {
    ctx.globalAlpha = alpha * fl * 0.9;
    ctx.strokeStyle = GREEN; ctx.lineWidth = 3; ctx.shadowBlur = 16; ctx.shadowColor = GREEN;
    ctx.beginPath(); ctx.arc(R.cx, R.cy, R.r * (0.42 + fl * 0.5), 0, TAU); ctx.stroke();
    ctx.shadowBlur = 0;
    const fg = ctx.createRadialGradient(R.cx, R.cy, 0, R.cx, R.cy, Math.max(W, H) * 0.55);
    fg.addColorStop(0, `rgba(0,255,135,${0.10 * fl})`);
    fg.addColorStop(1, "rgba(0,255,135,0)");
    ctx.globalAlpha = alpha; ctx.fillStyle = fg; ctx.fillRect(0, 0, W, H);
  }
  ctx.restore();
}

// ================= MAIN =====================================================
window.renderAt = function renderAt(t, hideBull, hideCandle, now, cx, cy, hideDive) {
  NOW = now || 0; // ambient wall-clock (seconds) — keeps the scene alive at rest
  const stage = document.getElementById("stage");
  const W = stage.clientWidth, H = stage.clientHeight;
  const $ = (id) => document.getElementById(id);
  const [outline, mac, base, screen, fly, bullC, bullR, home, grid, glow] =
    ["outline", "mac", "base", "screen", "panels", "bull", "bullreal", "homepage", "grid", "glow"].map($);
  const P = PHASES;

  // ---- boot ---------------------------------------------------------------
  // The laptop sketches ITSELF in — time-based, once, starting the moment the
  // loader reveals. The draw-on animation plays for everyone, but the resting
  // frame always ends complete (never a half-drawn sliver held hostage by the
  // scroll position, which was the old bug).
  if (DRAW_T0 === null && NOW > 0) DRAW_T0 = NOW;
  const bootDraw = DRAW_T0 === null ? 0 : easeOut(clamp((NOW - DRAW_T0) / 1.5, 0, 1));
  strokes().forEach(({ p, len }) => { p.style.strokeDashoffset = String(len * (1 - bootDraw)); });
  const outlineFade = 1 - seg(t, P.assembly[0], P.assembly[0] + (P.assembly[1] - P.assembly[0]) * 0.4);
  outline.style.opacity = String(outlineFade);
  // ambient breathing on the boot glow so the opening frame feels alive at rest
  glow.style.opacity = String(0.9 * (1 - seg(t, P.assembly[0], P.dive[1])) * (0.82 + 0.18 * Math.sin(NOW * 1.4)));

  // ---- assembly + dive (mac + panels) ------------------------------------
  const pAsm = seg(t, ...P.assembly);
  const pDive = seg(t, ...P.dive);
  const push = easeIO(seg(pDive, 0, 0.5));
  const macScale = lerp(1, 4.5, push); // gentler dive so the panel screenshots stay sharp
  const macVisible = t >= P.assembly[0] && push < 1;
  mac.style.display = macVisible ? "block" : "none";
  mac.style.opacity = String(seg(pAsm, 0, 0.15));
  mac.style.transform = `translate(-50%, -50%) scale(${macScale}) translateY(${lerp(0, -20, push)}px)`;
  base.style.opacity = String(1 - seg(push, 0.5, 0.9));
  screen.style.boxShadow = push > 0.5 ? "none" : "";
  if (macVisible) {
    document.querySelectorAll("#screen-inner .panel").forEach((el) => {
      const i = Number(el.dataset.i), sp = START_POSES[i];
      const local = easeIO(seg(pAsm, 0.05 + i * 0.055, 0.55 + i * 0.045));
      el.style.transform = `translate(${lerp(sp.x * 1400, 0, local)}px, ${lerp(sp.y * 1000, 0, local)}px) rotate(${lerp(sp.r, 0, local)}deg)`;
      el.style.opacity = String(Math.min(1, local * 2.5));
    });
  }
  // The real-3D tunnel (R3F, parent doc) owns the dive when live → skip the 2D
  // panel flythrough (the laptop zoom stays as the entry the tunnel fades over).
  const flyOn = pDive > 0.45 && t < P.regime[0] + 0.02 && !hideDive;
  fly.style.display = flyOn ? "block" : "none";
  if (flyOn) {
    document.querySelectorAll("#panels .panel").forEach((el) => {
      const i = Number(el.dataset.i), d = PANEL_DEFS[i].dive;
      const f = easeIO(seg(pDive, 0.45 + i * 0.02, 0.98 + i * 0.002));
      const s = lerp(0.55, 3.5, f);
      el.style.transform = `translate(-50%, -50%) translate(${d[0] * f * W * 1.15}px, ${d[1] * f * H * 1.15}px) scale(${s})`;
      el.style.opacity = String((1 - seg(f, 0.72, 1)) * seg(pDive, 0.42, 0.5));
    });
  }
  // grid: parallax through the dive, hold faint through the feature acts, gone by the bull
  grid.style.transform = `translate(${lerp(0, -140, pDive)}px, ${lerp(0, -90, pDive)}px) scale(${lerp(1, 1.6, pDive)})`;
  // ×0.7: background dimmed so the hero layers (charts, ring, bull) pop
  grid.style.opacity = String(lerp(0.9, 0.18, seg(t, P.dive[0], P.dive[1])) * (1 - seg(t, P.bull[0], P.bull[0] + (P.bull[1] - P.bull[0]) * 0.6)) * 0.7);

  // ---- canvas: exactly one heavy act draws per frame ---------------------
  const ctx = bullC.getContext("2d");
  ctx.clearRect(0, 0, W, H);

  // boot flourish: after the outline finishes, a glass sweep crosses the
  // laptop then a power-on pulse blooms — time-based, plays once per reveal.
  if (DRAW_T0 !== null && t < P.assembly[0] + 0.02) {
    const sw = clamp((NOW - DRAW_T0 - 1.55) / 0.9, 0, 1);
    if (sw > 0 && sw < 1) {
      const bandW = W * 0.18;
      const bx = lerp(-0.2 * W, 1.2 * W, easeIO(sw));
      ctx.save();
      ctx.translate(bx, H / 2); ctx.rotate(-18 * Math.PI / 180);
      const bg = ctx.createLinearGradient(-bandW / 2, 0, bandW / 2, 0);
      bg.addColorStop(0, "rgba(200,255,225,0)");
      bg.addColorStop(0.5, "rgba(200,255,225,0.10)");
      bg.addColorStop(1, "rgba(200,255,225,0)");
      ctx.fillStyle = bg;
      ctx.fillRect(-bandW / 2, -H, bandW, H * 2);
      ctx.restore();
    }
    const po = clamp((NOW - DRAW_T0 - 2.5) / 0.5, 0, 1);
    const poA = 0.16 * Math.sin(po * Math.PI); // spike then settle
    if (poA > 0.002) {
      const pg = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.min(W, H) * 0.45);
      pg.addColorStop(0, `rgba(0,255,135,${poA})`);
      pg.addColorStop(1, "rgba(0,255,135,0)");
      ctx.fillStyle = pg; ctx.fillRect(0, 0, W, H);
    }
  }

  // crossfade envelopes overlap at boundaries → no black flash between acts.
  // Gated on CHART so a 0-size init (geometry not built yet) can't NaN/crash.
  if (CHART) {
    const eReg = actEnv(t, P.regime), eCan = actEnv(t, P.candle), eSaf = actEnv(t, P.safety), eCon = actEnv(t, P.consensus);
    if (eReg > 0.001) drawRegime(ctx, seg(t, ...P.regime), eReg, W, H);
    // 3D candle canyon (R3F) owns this beat when live → skip the 2D chart.
    if (eCan > 0.001 && !hideCandle) drawCandle(ctx, seg(t, ...P.candle), eCan, W, H);
    if (eSaf > 0.001) drawSafety(ctx, seg(t, ...P.safety), eSaf, W, H);
    if (eCon > 0.001) drawConsensus(ctx, seg(t, ...P.consensus), eCon, W, H);
  }

  // ---- bull (particle logo) ----------------------------------------------
  // The real-3D bull (R3F, parent doc) owns ~0.71–0.80. The classic particle-bull
  // LOGO takes over as that bull STARTS clearing: particles assemble (converge) →
  // hold → scatter into the Matrix rain. Absolute "logo phase" timings, not
  // derived from the bull act.
  // LOGO0 starts at the bull's out0, not its out1. Starting at 0.8 meant the
  // converge ramp began from zero at the exact progress the 3D bull, the grid
  // and the consensus ring had all already reached zero — a black frame at the
  // charge. Beginning at 0.775 puts real particles on screen through the
  // handoff, under the charge's impact flash. Keep in step with BULL3D.out0 in
  // lib/cinema.ts and with `hideBull` in ScrollCinema.tsx.
  const LOGO0 = 0.80, CONV_END = 0.855, DIS0 = 0.87, DIS1 = 0.925;
  const dissolve = 1 - seg(t, DIS0, DIS1);
  const bullOn = t >= LOGO0 - 0.01 && t < DIS1 + 0.02;
  // `hideBull` (per frame) keeps the particle logo hidden while the 3D bull is up.
  if (bullOn && !hideBull) {
    const conv = easeOut(seg(t, LOGO0, CONV_END));
    const brightness = 0.5 + 0.5 * seg(t, LOGO0, CONV_END);
    for (const pt of PARTICLES) {
      const x = lerp(pt.sx, pt.tx, conv), y = lerp(pt.sy, pt.ty, conv);
      ctx.globalAlpha = (0.35 + 0.65 * conv) * brightness * dissolve;
      ctx.shadowBlur = pt.glow ? 10 : 0; ctx.shadowColor = GREEN;
      ctx.fillStyle = pt.tint < 0.6 ? GREEN : INK;
      ctx.fillRect(x, y, pt.size, pt.size);
    }
    ctx.globalAlpha = 1; ctx.shadowBlur = 0;
    const g = ctx.createRadialGradient(W / 2, H * 0.62, 10, W / 2, H * 0.62, W * 0.3);
    g.addColorStop(0, `rgba(0,255,135,${0.16 * conv * brightness * dissolve})`);
    g.addColorStop(1, "rgba(0,255,135,0)");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  bullR.style.opacity = "0";

  // ---- matrix rain + homepage resolve ------------------------------------
  // The rain used to thin out only at t=1.0 — the exact instant the canvas
  // crossfades and collapse() fires. So it was still at ~32% opacity over the
  // resolved homepage at 0.987 and then got CUT rather than clearing: the last
  // thing you saw of the film was the landing page behind a green curtain,
  // which is most of why the hand-off read as a jump. Clear it by 0.975 and the
  // final 2.5% (~35vh of scroll) is a clean, fully resolved hero that the
  // razor-thin canvas fade at 0.998 can swap for the live one invisibly.
  const rainStart = 0.9, rainPeakEnd = 0.94, rainThin = 0.95, rainEnd = 0.975;
  const rainAmt = seg(t, rainStart, rainPeakEnd) * (1 - seg(t, rainThin, rainEnd));
  if (rainAmt > 0.002) {
    const cell = MATRIX_CELL, rows = Math.ceil(H / cell) + 2;
    ctx.font = `${Math.round(cell * 0.92)}px ${MONO}`;
    ctx.textBaseline = "top";
    const fall = (t - LOGO0) + NOW * 0.1; // rain keeps falling even at rest
    for (const col of MATRIX) {
      const period = rows + col.len;
      const head = ((col.phase * period) + fall * col.speed * rows * 4.5) % period;
      for (let k = 0; k < col.len; k++) {
        const row = Math.floor((((head - k) % period) + period) % period);
        const y = row * cell;
        if (y > H) continue;
        const chc = MATRIX_CHARS[(col.lead + row * 3 + Math.floor(fall * 26)) % MATRIX_CHARS.length];
        if (k === 0) { ctx.fillStyle = `rgba(214,255,232,${rainAmt})`; ctx.shadowBlur = 8; ctx.shadowColor = GREEN; }
        else { ctx.fillStyle = `rgba(0,255,135,${rainAmt * (1 - k / col.len) * 0.82})`; ctx.shadowBlur = 0; }
        ctx.fillText(chc, col.x, y);
      }
    }
    ctx.shadowBlur = 0;
  }
  // Fully opaque as the rain clears, not 0.02 before the swap — the hold is
  // what makes the cut invisible.
  const homeStart = 0.91, homeEnd = 0.97;
  home.style.opacity = String(seg(t, homeStart, homeEnd));

  // ---- cursor spotlight: the pointer carries a soft torch through the 2D acts
  if (cx !== undefined && cy !== undefined) {
    const gx = (cx * 0.5 + 0.5) * W, gy = (cy * 0.5 + 0.5) * H;
    const fadeOut = 1 - seg(t, homeStart, homeEnd); // clear of the homepage reveal
    const rad = Math.min(W, H) * 0.34;
    const g = ctx.createRadialGradient(gx, gy, 0, gx, gy, rad);
    g.addColorStop(0, `rgba(0,255,135,${0.05 * fadeOut})`);
    g.addColorStop(0.5, `rgba(0,255,135,${0.02 * fadeOut})`);
    g.addColorStop(1, "rgba(0,255,135,0)");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  // ---- outro: settle to the page ground before the swap -------------------
  // #homepage is a raster baked at 1600x1000 and shown through object-fit:cover,
  // so it scales uniformly with the viewport while the LIVE hero re-flows (fluid
  // clamp() type, fixed paddings). The two therefore only pixel-match at the
  // width the plate was captured at. Measured at 1280 wide: the CTA sits 66px
  // higher and 10px shorter in the plate than in the live hero — 0.8x, exactly
  // the viewport ratio. No re-bake can close that; it is geometry.
  // So stop trying to cut invisibly between two mismatched plates. Ramp the
  // whole frame down to the page ground over the last ~1.4% and let the wrapper
  // crossfade (0.998-1.0) hand off from an empty frame: the film settles, and
  // the real hero is simply already there. Reads the same at every width.
  // The canvas sits ABOVE #homepage in the stage, so this covers the plate too.
  const outro = seg(t, 0.984, 0.998);
  if (outro > 0.002) {
    ctx.fillStyle = `rgba(5, 5, 5, ${outro})`;
    ctx.fillRect(0, 0, W, H);
  }
  return true;
};
</script>
</body>
