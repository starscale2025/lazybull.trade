<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #050505; --fg: #f5f5f0; --fg-dim: #8a8a82;
    --bull: #52ffa5; --bear: #ff2e63; --cyan: #3884ff; --amber: #ffb800; --border: #1f1f1f;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; transition: none !important; animation: none !important; }
  html, body { width: 100%; height: 100%; background: var(--bg); overflow: hidden; }
  #stage {
    position: relative; width: 100vw; height: 100vh; overflow: hidden;
    background: var(--bg);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  #grid {
    position: absolute; inset: -60%;
    background-image:
      linear-gradient(rgba(245,245,240,0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(245,245,240,0.045) 1px, transparent 1px);
    background-size: 72px 72px;
  }
  #vignette {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,0.8) 100%);
    pointer-events: none;
  }
  #glow {
    position: absolute; left: 50%; top: 50%; width: 120vw; height: 120vh;
    transform: translate(-50%, -50%);
    background:
      radial-gradient(38% 42% at 42% 44%, rgba(110,120,255,0.16), transparent 70%),
      radial-gradient(34% 40% at 62% 58%, rgba(56,132,255,0.08), transparent 70%);
    pointer-events: none;
  }
  #outline { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
  #outline path {
    fill: none; stroke: #8f9bff; stroke-width: 2;
    filter: drop-shadow(0 0 12px rgba(110,120,255,0.55));
  }
  #mac { position: absolute; left: 50%; top: 50%; width: 840px; height: 560px;
         transform: translate(-50%, -50%); }
  #screen {
    position: absolute; left: 50%; top: 0; transform: translateX(-50%);
    width: 780px; height: 490px; border-radius: 18px;
    background: #0a0a0a; border: 2px solid #2a2a2a;
    box-shadow: 0 0 0 8px #111, 0 30px 80px rgba(0,0,0,0.8);
    overflow: hidden;
  }
  #screen-inner { position: absolute; inset: 14px; background: var(--bg); overflow: hidden; }
  #base {
    position: absolute; left: 50%; top: 498px; transform: translateX(-50%);
    width: 840px; height: 26px; border-radius: 4px 4px 14px 14px;
    background: linear-gradient(#2c2c2c, #151515);
  }
  #base::after {
    content: ""; position: absolute; left: 50%; top: 0; transform: translateX(-50%);
    width: 130px; height: 9px; border-radius: 0 0 10px 10px; background: #0c0c0c;
  }
  .panel {
    position: absolute; border: 1px solid var(--border); border-radius: 8px;
    background-color: #0a0a0a; background-repeat: no-repeat;
    box-shadow: 0 18px 50px rgba(0,0,0,0.65), 0 0 0 1px rgba(143,115,255,0.08);
    overflow: hidden; will-change: transform, opacity;
  }
  .panel::after {
    content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px;
    background: linear-gradient(90deg, var(--bull), transparent 60%); opacity: 0.7;
  }
  #panels { position: absolute; inset: 0; }
  #bull { position: absolute; inset: 0; width: 100%; height: 100%; }
  #bullreal {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    height: 92%; opacity: 0;
  }
</style>
</head>
<body>
<div id="stage">
  <div id="glow"></div>
  <div id="grid"></div>
  <div id="mac">
    <div id="screen"><div id="screen-inner"></div></div>
    <div id="base"></div>
  </div>
  <div id="panels"></div>
  <canvas id="bull"></canvas>
  <img id="bullreal" alt="">
  <svg id="outline" width="880" height="620" viewBox="0 0 880 620">
    <path id="outline-screen" d="M 60 20 H 820 Q 838 20 838 38 V 500 H 42 V 38 Q 42 20 60 20 Z"/>
    <path id="outline-base" d="M 10 530 H 870 Q 870 560 830 560 H 50 Q 10 560 10 530 Z"/>
  </svg>
  <div id="vignette"></div>
</div>

<script>
// ---- timeline: PHASES are RECEIVED from initScene (single source of truth =
// ACTS in lib/cinema.ts). Fallback default kept in sync for standalone opens. --
let PHASES = {
  boot: [0.00, 0.05], assembly: [0.05, 0.15], dive: [0.15, 0.24], regime: [0.24, 0.32],
  candle: [0.32, 0.59], safety: [0.59, 0.69], consensus: [0.69, 0.73], bull: [0.73, 0.84],
  mark: [0.84, 1.00],
};

// ---- tiny deterministic helpers ------------------------------------------
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const easeIO = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
const easeOut = (t) => 1 - Math.pow(1 - t, 3);
// Crossfade envelope for a feature act: ramps in just before the act and out
// just after, overlapping the neighbours at the boundary so there is no black
// flash between acts (at a shared boundary both sit at ~0.5 → a clean dissolve).
const actEnv = (t, ph, fin = 0.02, fout = 0.024) =>
  seg(t, ph[0] - fin, ph[0] + fin) * (1 - seg(t, ph[1] - fout, ph[1] + fout));
const TAU = Math.PI * 2;
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
    let z = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    z = (z + Math.imul(z ^ (z >>> 7), 61 | z)) ^ z;
    return ((z ^ (z >>> 14)) >>> 0) / 4294967296;
  };
}
function normal(rnd) { // Box-Muller
  let u = 0, v = 0;
  while (u === 0) u = rnd();
  while (v === 0) v = rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * v);
}
// lerp between two #rrggbb hex colors
function mixHex(a, b, t) {
  const pa = [parseInt(a.slice(1, 3), 16), parseInt(a.slice(3, 5), 16), parseInt(a.slice(5, 7), 16)];
  const pb = [parseInt(b.slice(1, 3), 16), parseInt(b.slice(3, 5), 16), parseInt(b.slice(5, 7), 16)];
  const c = pa.map((x, i) => Math.round(lerp(x, pb[i], clamp(t, 0, 1))));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}
// PALETTE + TYPEFACE — both RECEIVED from the parent via initScene, never
// re-declared here. This copy had already drifted: RED was #ff5c5c against the
// site's --bear #ff2e63, and AMBER #ffb020 against --ffb800, so the film's
// crash was a different red from the product's. And every ctx.font asked for
// `ui-monospace`, i.e. whatever the operating system happens to supply — the
// nine-act showpiece was typeset in Menlo on a Mac, Consolas on Windows and
// DejaVu on Linux. MONO is the parent's own JetBrains Mono face, injected into
// this document as an @font-face by ScrollCinema before initScene runs.
let GREEN = "#52ffa5", RED = "#ff2e63", CYAN = "#3884ff", AMBER = "#ffb800", INK = "#f5f5f0", GRAY = "#8a8a82", BG = "#050505";
// The brand ramp (globals.css THE BRAND GRADIENT): violet → blue → mint. GREEN
// stays for what it means (up, profit, armed); decoration draws from this.
const RAMP = [[143, 115, 255], [92, 154, 255], [82, 255, 165]];
function rampAt(f) {
  f = Math.min(1, Math.max(0, f)) * (RAMP.length - 1);
  const i = Math.min(RAMP.length - 2, Math.floor(f)), k = f - i;
  return RAMP[i].map((v, j) => Math.round(v + (RAMP[i + 1][j] - v) * k));
}
function ringGradient(ctx, cx, cy) {
  if (!ctx.createConicGradient) return CYAN;
  const g = ctx.createConicGradient(-Math.PI / 2, cx, cy);
  g.addColorStop(0, "#8f73ff"); g.addColorStop(0.5, "#5c9aff"); g.addColorStop(1, "#52ffa5");
  return g;
}
let MONO = "ui-monospace, SFMono-Regular, Menlo, monospace";
let SCENE_DPR = 1;
// alpha wrapper that accepts either #rrggbb or rgb(...) so fills never break
function withAlpha(c, a) {
  if (c[0] === "#") {
    const r = parseInt(c.slice(1, 3), 16), g = parseInt(c.slice(3, 5), 16), b = parseInt(c.slice(5, 7), 16);
    return `rgba(${r},${g},${b},${a})`;
  }
  return c.replace("rgb(", "rgba(").replace(")", `,${a})`);
}

// ---- panels (each a distinct app screen) ---------------------------------
const PANEL_DEFS = [
  { shot: "chain", dive: [-1.0, -0.4] }, { shot: "trade", dive: [ 1.0, -0.3] },
  { shot: "learn", dive: [-0.7,  0.8] }, { shot: "quant", dive: [ 0.8,  0.7] },
  { shot: "pro",   dive: [-1.2,  0.1] }, { shot: "chain", dive: [ 1.2,  0.2] },
  { shot: "bots",  dive: [-0.4, -1.0] }, { shot: "about", dive: [ 0.4,  1.1] },
  { shot: "quant", dive: [ 0.2, -1.2] },
];
const START_POSES = [
  { x: -0.55, y: -0.35, r: -24 }, { x: 0.0,  y: -0.62, r: 10 }, { x: 0.55, y: -0.38, r: 22 },
  { x: -0.68, y:  0.05, r: -14 }, { x: 0.7,  y:  0.02, r: 16 }, { x: -0.5, y:  0.42, r: -20 },
  { x:  0.0,  y:  0.6,  r:  8 },  { x: 0.52, y:  0.44, r: 18 }, { x: -0.2, y: -0.55, r: -6 },
];

// ---- bull-head silhouette -------------------------------------------------
const BULL_HALF = [
  [0.05, 0.30], [0.14, 0.24], [0.24, 0.20], [0.42, 0.12], [0.62, 0.04],
  [0.44, 0.21], [0.31, 0.27], [0.32, 0.36], [0.36, 0.46],
  [0.30, 0.58], [0.23, 0.71], [0.17, 0.81], [0.10, 0.90], [0.03, 0.95],
];
function bullOutline() {
  const right = BULL_HALF;
  const left = [...BULL_HALF].reverse().map(([x, y]) => [-x, y]);
  return right.concat(left);
}

// THE MARK (Phase 4, M25): lazybull's bull drawn as a payoff, a long strangle
// at expiry read as a head (the floor is the jaw, the rising legs the horns).
// The film ends on it. A unit box, y down. KEEP IN STEP WITH lib/bull-mark.ts,
// which the nav's logo and the phone film draw from.
const BULL_MARK = [[0.0, 0.0], [0.09, 0.27], [0.29, 0.31], [0.4, 0.86], [0.6, 0.86], [0.71, 0.31], [0.91, 0.27], [1.0, 0.0]];
function markSamples(n) {
  const segs = BULL_MARK.slice(1).map((p, i) => ({ a: BULL_MARK[i], b: p, len: Math.hypot(p[0] - BULL_MARK[i][0], p[1] - BULL_MARK[i][1]) }));
  const total = segs.reduce((s, x) => s + x.len, 0);
  const out = [];
  for (let i = 0; i < n; i++) {
    let d = (i / Math.max(1, n - 1)) * total;
    for (const sg of segs) {
      if (d <= sg.len || sg === segs[segs.length - 1]) {
        const t = sg.len ? Math.min(1, d / sg.len) : 0;
        out.push([sg.a[0] + (sg.b[0] - sg.a[0]) * t, sg.a[1] + (sg.b[1] - sg.a[1]) * t]);
        break;
      }
      d -= sg.len;
    }
  }
  return out;
}
// Where the mark sits: right of centre, so "Welcome in." stands to its left.
let MARK_BOX = { x: 0, y: 0, w: 0, h: 0 };
let MARK_STAGE = { W: 1, H: 1 };
// The mark's box as shares of the scene, for the page that draws the mark's
// line over the stage (ScrollCinema's match-cut) and must put it exactly here.
window.markRect = () => {
  const { W, H } = MARK_STAGE;
  return { x: MARK_BOX.x / W, y: MARK_BOX.y / H, w: MARK_BOX.w / W, h: MARK_BOX.h / H, lw: Math.max(2, MARK_BOX.w / 90) / W };
};

// The vote's ring and the payoff's floor, as shares of the scene, for the page:
// the matter gathers on the one and the floor line lands on the other.
window.ringRect = () => {
  const { W, H } = MARK_STAGE;
  return RING ? { cx: RING.cx / W, cy: RING.cy / H, rx: RING.r / W, ry: RING.r / H } : null;
};
window.payoffLine = () => {
  const { W, H } = MARK_STAGE;
  return PAYOFF ? { pts: PAYOFF.pts.map((p) => [p.x / W, p.y / H]), zero: PAYOFF.zeroY / H } : null;
};
window.floorLine = () => {
  const { W, H } = MARK_STAGE;
  return PAYOFF ? { x0: PAYOFF.floorX0 / W, y0: PAYOFF.lossY / H, x1: PAYOFF.floorX1 / W, y1: PAYOFF.lossY / H } : null;
};

// 12 bots for the consensus ring — real families/verdicts from the app.
// 10 agree (up>0.6), 2 dissent — a realistic strong majority, not unanimity.
const BOTS = [
  { k: "SMA", fam: "trend", up: 0.86 }, { k: "MACD", fam: "trend", up: 0.80 },
  { k: "RSI", fam: "trend", up: 0.43 }, { k: "BOLL", fam: "trend", up: 0.78 },
  { k: "DON", fam: "trend", up: 0.83 }, { k: "Z", fam: "stats", up: 0.64 },
  { k: "KAL", fam: "stats", up: 0.70 }, { k: "LR", fam: "stats", up: 0.67 },
  { k: "DIR", fam: "ai", up: 0.88 }, { k: "MAG", fam: "ai", up: 0.74 },
  { k: "CNN", fam: "ai", up: 0.41 }, { k: "TXR", fam: "ai", up: 0.82 },
];
const FAM_COLOR = { trend: GREEN, stats: CYAN, ai: RED };

// ---- scene state -----------------------------------------------------------
let CFG = null, PARTICLES = [], BULL_IMGS = [];
let NOW = 0; // ambient time (seconds) set by renderAt — drives always-on motion
let DRAW_T0 = null; // when the loader revealed → the laptop draw-on starts
let CHART = null;      // shared chart rect { x, y, w, h }
let REGIME = null;     // { incr: number[] }
let CANDLES = null;    // { bars:[{x,oy,cy,hy,ly,bw,up,crash}], diverge, spot:[] }
let PAYOFF = null;     // { pts:[{x,y}], zeroY, lossY, beX, maxLossX }
let RING = null;       // { cx, cy, r, nodes:[{a,x,y,col,up,k}] }

// The parent's act rail sits over this frame's left edge; its right edge
// (plate included) arrives through initScene, so no chart is drawn under it.
// Without it the safety act's $0 printed under the rail's last rows.
let INSET_LEFT = 0;
function computeChart(W, H) {
  // lower-center so the feature-act copy (top third) never overlaps the chart
  const x = Math.max(W * 0.11, INSET_LEFT + 24);
  CHART = { x, y: H * 0.34, w: W * 0.89 - x, h: H * 0.46 };
}

// Two reference paths the regime act blends between: a mean-reverting "choppy"
// walk (low Hurst) and a smooth "trend" (high Hurst). Blending makes the three
// regimes read distinctly as the Hurst dial rises.
function buildRegime() {
  const rnd = mulberry32(4242), n = 140;
  const choppy = [], trend = [];
  let cv = 0, tv = 0;
  for (let i = 0; i < n; i++) {
    cv = cv * 0.55 + (rnd() - 0.5) * 2.4; // OU-ish: pulled back to 0 → oscillates
    choppy.push(cv);
    tv += 0.5 + (rnd() - 0.5) * 0.55;      // persistent climb with light noise
    trend.push(tv);
  }
  REGIME = { choppy, trend, n };
}

// Deterministic GBM candle series: climb → crash → stabilize, plus an AI
// forecast line + cone that bends DOWN before the crash and that the crash
// then falls into. All pixel geometry mapped to the shared CHART rect.
function buildCandles() {
  const ch = CHART, N = 90, DIVERGE = 52, CRASH = 64, END_CRASH = 82, dt = 1 / 52; // AI diverges 12 bars before the crash
  const rnd = mulberry32(7);
  let price = 100;
  const raw = [];
  for (let i = 0; i < N; i++) {
    let mu, sig;
    if (i < CRASH) { mu = 1.05; sig = 0.85; }          // euphoric climb
    else if (i < END_CRASH) { mu = -3.6; sig = 2.1; }  // the crash
    else { mu = 0.15; sig = 0.7; }                      // stabilize tail
    const o = price;
    price = price * Math.exp((mu - 0.5 * sig * sig) * dt + sig * Math.sqrt(dt) * normal(rnd));
    const c = price;
    const hi = Math.max(o, c), lo = Math.min(o, c);
    const wick = (0.25 + rnd() * 0.6) * Math.abs(c - o) + o * 0.0015;
    raw.push({ o, c, h: hi + wick, l: lo - wick, up: c >= o, crash: i >= CRASH && i < END_CRASH });
  }
  // price range for pixel mapping (pad a little)
  let pmin = Infinity, pmax = -Infinity;
  for (const b of raw) { pmin = Math.min(pmin, b.l); pmax = Math.max(pmax, b.h); }
  const pad = (pmax - pmin) * 0.08; pmin -= pad; pmax += pad;
  const yOf = (p) => ch.y + ch.h * (1 - (p - pmin) / (pmax - pmin));
  const xOf = (i) => ch.x + (i + 0.5) * (ch.w / N);
  const bw = Math.max(2, (ch.w / N) * 0.6);
  const bars = raw.map((b, i) => ({
    x: xOf(i), oy: yOf(b.o), cy: yOf(b.c), hy: yOf(b.h), ly: yOf(b.l), bw, up: b.up, crash: b.crash,
  }));
  CANDLES = { bars, diverge: DIVERGE, crash: CRASH, endCrash: END_CRASH, N, spot: raw.map((b) => b.c) };
}

// THE VISITOR'S POSITION. The hero instrument above the film publishes it
// (lib/hero-position.ts) and the parent hands it over through initScene and
// setPosition, so the act whose headline is "your worst case is a number you
// chose" draws the number the visitor chose: the hero's strikes, its most it
// can lose and its most it can make. It used to draw its own −$80 / +$420
// spread, a second position under the first one's headline. This fallback is
// the hero's untouched default, for a standalone open of this file.
let POSITION = { k1: 100, k2: 108, maxLoss: 230.33, maxProfit: 569.67, breakeven: 102.3, chosen: false };
window.setPosition = function setPosition(pos) {
  if (!pos) return;
  POSITION = pos;
  if (CHART) buildPayoff();
};

// Bull Call Spread payoff: flat max-loss floor → ramp → flat max-profit ceiling.
// Framed, not copied: the hero's own price axis puts K2 at 80% of the width,
// which leaves the upside's label nowhere to sit but across the ramp. The film
// keeps the strikes' spacing on a 40-point axis (wider if the spread is) and
// parks K2 at 62%, so the ceiling has room for its number and its condition.
function buildPayoff() {
  const ch = CHART, pos = POSITION;
  const maxLoss = -Math.abs(pos.maxLoss), maxProfit = Math.abs(pos.maxProfit);
  const span = Math.max(40, (pos.k2 - pos.k1) / 0.5);
  const k2 = 0.62, k1 = k2 - (pos.k2 - pos.k1) / span;
  const yOf = (v) => ch.y + ch.h * (1 - (v - maxLoss) / (maxProfit - maxLoss));
  const xOf = (u) => ch.x + u * ch.w;
  const pts = [
    { u: 0, v: maxLoss }, { u: k1, v: maxLoss }, { u: k2, v: maxProfit }, { u: 1, v: maxProfit },
  ].map((p) => ({ x: xOf(p.u), y: yOf(p.v) }));
  const beU = k1 + (k2 - k1) * (0 - maxLoss) / (maxProfit - maxLoss); // where payoff crosses 0
  PAYOFF = { pts, zeroY: yOf(0), lossY: yOf(maxLoss), profY: yOf(maxProfit), beX: xOf(beU), floorX0: xOf(0), floorX1: xOf(k1), maxLoss, maxProfit, pos };
}

function buildRing(W, H) {
  const cx = W / 2, cy = H * 0.56, r = Math.min(W, H) * 0.25;
  const nodes = BOTS.map((b, i) => {
    const a = -Math.PI / 2 + (i / BOTS.length) * TAU;
    return { a, x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r, col: FAM_COLOR[b.fam], up: b.up, k: b.k };
  });
  RING = { cx, cy, r, nodes };
}

window.initScene = async function initScene(cfg) {
  CFG = cfg;
  // Adopt the parent's resolved design tokens and mono face, so this scene can
  // never drift from the site again.
  if (cfg.tokens) {
    const t = cfg.tokens;
    if (t.bull) GREEN = t.bull;
    if (t.bear) RED = t.bear;
    if (t.cyan) CYAN = t.cyan;
    if (t.amber) AMBER = t.amber;
    if (t.fg) INK = t.fg;
    if (t.fgDim) GRAY = t.fgDim;
    if (t.bg) BG = t.bg;
    const rs = document.documentElement.style;
    for (const [k, v] of Object.entries({
      "--bull": t.bull, "--bear": t.bear, "--cyan": t.cyan,
      "--amber": t.amber, "--fg": t.fg, "--fg-dim": t.fgDim, "--bg": t.bg,
    })) if (v) rs.setProperty(k, v);
  }
  if (cfg.mono) {
    MONO = cfg.mono;
    // Canvas does NOT trigger a webfont fetch: setting ctx.font to a family that
    // has not loaded silently falls back, and `document.fonts.ready` resolves
    // happily because nothing in this DOM references the face. Ask for it
    // explicitly, then let the existing fonts.ready await below settle.
    try { await document.fonts.load(`700 24px ${MONO}`); } catch { /* fallback stands */ }
  }
  if (cfg.position) POSITION = cfg.position;
  if (typeof cfg.insetLeft === "number") INSET_LEFT = cfg.insetLeft;
  if (cfg.phases) {
    PHASES = {};
    for (const k in cfg.phases) PHASES[k] = [cfg.phases[k].from, cfg.phases[k].to];
  }
  const stage = document.getElementById("stage");
  const W = stage.clientWidth, H = stage.clientHeight;
  // Bail on an unlaid-out / collapsed 0-size stage: keep any prior geometry and
  // let the next resize re-init at a real size (avoids NaN chart mapping).
  if (W < 2 || H < 2) return true;
  STROKES = null; // re-measure the boot outline lengths on every (re)init

  // Panels ×2 (grid inside the mac + fly layer).
  const inner = document.getElementById("screen-inner");
  const fly = document.getElementById("panels");
  inner.innerHTML = ""; fly.innerHTML = "";
  PANEL_DEFS.forEach((def, i) => {
    for (const [parent, cls] of [[inner, "grid"], [fly, "fly"]]) {
      const el = document.createElement("div");
      el.className = "panel " + cls;
      el.dataset.i = String(i);
      el.style.backgroundImage = `url(${CFG.shots[def.shot]})`;
      el.style.backgroundSize = "cover";
      el.style.backgroundPosition = "top center";
      parent.appendChild(el);
    }
  });
  document.querySelectorAll("#screen-inner .panel").forEach((el, i) => {
    const col = i % 3, row = Math.floor(i / 3);
    el.style.width = "236px"; el.style.height = "142px";
    el.style.left = `${8 + col * 246}px`; el.style.top = `${8 + row * 152}px`;
  });
  document.querySelectorAll("#panels .panel").forEach((el) => {
    el.style.width = `${Math.round(W * 0.28)}px`;
    el.style.height = `${Math.round(W * 0.17)}px`;
    el.style.left = "50%"; el.style.top = "50%";
  });

  // Bull particles.
  const rnd = mulberry32(1337);
  const outline = bullOutline();
  // Where the 3D bull stands as it dissolves (Bull3D frames it right of
  // centre), so its particles leave from it rather than from a second bull.
  const cx = W * 0.62, cy = H * 0.56, scale = Math.min(W, H) * 0.46;
  const mw = Math.min(W * 0.34, H * 0.5);
  MARK_BOX = { x: W * 0.64 - mw / 2, y: H * 0.5 - mw * 0.36, w: mw, h: mw * 0.72 };
  MARK_STAGE = { W, H };
  // Every particle has a place on the mark too, spread by arc length, so the
  // bull's particles can settle onto it (M25).
  const markPts = markSamples(1200);
  PARTICLES = [];
  for (let i = 0; i < 1200; i++) {
    const u = i / 1200, fi = u * (outline.length - 1), k = Math.floor(fi), fr = fi - k;
    const a = outline[k], b = outline[Math.min(k + 1, outline.length - 1)];
    const jx = (rnd() - 0.5) * 0.05, jy = (rnd() - 0.5) * 0.05;
    PARTICLES.push({
      sx: rnd() * W, sy: rnd() * H,
      tx: cx + (lerp(a[0], b[0], fr) + jx) * scale,
      ty: cy + (lerp(a[1], b[1], fr) + jy - 0.5) * scale * 1.15,
      tint: rnd(), size: rnd() < 0.25 ? 3 : 2, glow: i % 4 === 0,
      mx: MARK_BOX.x + markPts[i][0] * MARK_BOX.w + (rnd() - 0.5) * 3,
      my: MARK_BOX.y + markPts[i][1] * MARK_BOX.h + (rnd() - 0.5) * 3,
      mt: markPts[i][0],
    });
  }
  // At the screen's real resolution. This canvas used to be one pixel per CSS
  // pixel, so on a retina display every line and figure of the 2D acts was
  // upscaled and soft, like a video of itself. Drawing stays in CSS pixels.
  const bullCanvas = document.getElementById("bull");
  SCENE_DPR = Math.min(window.devicePixelRatio || 1, 2);
  bullCanvas.width = Math.round(W * SCENE_DPR); bullCanvas.height = Math.round(H * SCENE_DPR);


  // Precompute feature-act geometry (size dependent → recomputed on resize).
  computeChart(W, H);
  buildRegime();
  buildCandles();
  buildPayoff();
  buildRing(W, H);

  const urls = Object.values(CFG.shots);
  if (CFG.bullFrames && CFG.bullFrames.length) {
    BULL_IMGS = CFG.bullFrames.map((u) => { const im = new Image(); im.src = u; return im; });
    urls.push(...CFG.bullFrames);
  }
  await Promise.all(urls.map((u) => new Promise((res) => {
    const im = new Image(); im.onload = res; im.onerror = res; im.src = u;
  })));
  document.fonts && (await document.fonts.ready);
  return true;
};

let STROKES = null;
function strokes() {
  if (!STROKES) {
    STROKES = ["outline-screen", "outline-base"].map((id) => {
      const p = document.getElementById(id);
      return { p, len: p.getTotalLength() };
    });
    STROKES.forEach(({ p, len }) => { p.style.strokeDasharray = String(len); });
  }
  return STROKES;
}

// ================= ACT RENDERERS (canvas) =================================

// A line drawn as what the candles are made of: a glass tube with a filament
// in it. `trace` builds the path; it is called once per layer.
function tube(ctx, trace, col, w, strength) {
  const k = strength === undefined ? 1 : strength;
  ctx.save();
  ctx.lineJoin = "round"; ctx.lineCap = "round";
  // the light it throws on the air
  for (const [lw, a] of [[w * 9, 0.03], [w * 5.5, 0.055], [w * 3.2, 0.11]]) {
    trace(); ctx.strokeStyle = withAlpha(col, a * k); ctx.lineWidth = lw; ctx.stroke();
  }
  // the sleeve, then the filament
  trace(); ctx.strokeStyle = withAlpha(col, 0.3 * k); ctx.lineWidth = w * 1.8; ctx.stroke();
  trace(); ctx.strokeStyle = withAlpha(col, 0.95 * k); ctx.lineWidth = w * 0.72; ctx.stroke();
  trace(); ctx.strokeStyle = `rgba(255,255,255,${0.72 * k})`; ctx.lineWidth = Math.max(0.7, w * 0.26); ctx.stroke();
  // and the line of light along the top of the glass
  ctx.translate(0, -w * 0.72);
  trace(); ctx.strokeStyle = `rgba(255,255,255,${0.22 * k})`; ctx.lineWidth = 0.7; ctx.stroke();
  ctx.restore();
}

// Act: regime — a price path morphs trend↔reversion↔noise and recolors.
function drawRegime(ctx, r, env, W, H) {
  const ch = CHART, alpha = env;
  if (alpha <= 0.001) return;
  const H_ex = lerp(0.36, 0.66, easeIO(r)); // Hurst rises: reversion → noise → trend
  const blend = easeIO(r);
  const n = REGIME.n;
  // blend the choppy and trend reference paths
  const ys = []; let vmin = 1e9, vmax = -1e9;
  for (let i = 0; i < n; i++) {
    const v = lerp(REGIME.choppy[i], REGIME.trend[i], blend);
    ys.push(v); if (v < vmin) vmin = v; if (v > vmax) vmax = v;
  }
  const span = Math.max(1e-6, vmax - vmin);
  const xOf = (i) => ch.x + (i / (n - 1)) * ch.w;
  const yOf = (val) => ch.y + ch.h * (1 - (val - vmin) / span);
  // color by regime: cyan (revert) → gray (random) → green (trend)
  const col = H_ex < 0.47 ? mixHex(GRAY, CYAN, seg(0.47 - H_ex, 0, 0.11))
    : H_ex > 0.53 ? mixHex(GRAY, GREEN, seg(H_ex - 0.53, 0, 0.13))
    : GRAY;
  ctx.save(); ctx.globalAlpha = alpha;
  // fill under curve
  const grad = ctx.createLinearGradient(0, ch.y, 0, ch.y + ch.h);
  grad.addColorStop(0, withAlpha(col, 0.16));
  grad.addColorStop(1, "rgba(0,0,0,0)");
  ctx.beginPath(); ctx.moveTo(xOf(0), yOf(ys[0]));
  for (let i = 1; i < n; i++) ctx.lineTo(xOf(i), yOf(ys[i]));
  ctx.lineTo(xOf(n - 1), ch.y + ch.h); ctx.lineTo(xOf(0), ch.y + ch.h); ctx.closePath();
  ctx.fillStyle = grad; ctx.fill();
  // stroke
  ctx.beginPath(); ctx.moveTo(xOf(0), yOf(ys[0]));
  for (let i = 1; i < n; i++) ctx.lineTo(xOf(i), yOf(ys[i]));
  ctx.strokeStyle = col; ctx.lineWidth = 2.2; ctx.shadowBlur = 10; ctx.shadowColor = col; ctx.stroke();
  ctx.shadowBlur = 0;
  // regime meter (bottom): a needle riding 0..1 at H, with the detected regime
  // name and what the platform would run for it (real Hurst → bot mapping).
  const my = ch.y + ch.h + Math.min(44, H * 0.055), mx0 = ch.x + ch.w * 0.30, mw = ch.w * 0.40;
  ctx.strokeStyle = "rgba(245,245,240,0.22)"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(mx0, my); ctx.lineTo(mx0 + mw, my); ctx.stroke();
  const nx = mx0 + mw * seg(H_ex, 0.34, 0.68);
  ctx.fillStyle = col; ctx.fillRect(nx - 1.5, my - 7, 3, 14);
  const name = H_ex > 0.56 ? "TRENDING" : H_ex < 0.44 ? "MEAN-REVERTING" : "RANDOM WALK";
  // Describes which rule families historically fit the regime; it never tells
  // the viewer what to run or to stay out; the old wording here was an instruction.
  const rec = H_ex > 0.56 ? "trend rules fit this mood · SMA · MACD · Donchian"
    : H_ex < 0.44 ? "reversion rules fit this mood · Z-Score · Kalman" : "no rule held an edge in this mood";
  ctx.textAlign = "center"; ctx.textBaseline = "top";
  ctx.fillStyle = col; ctx.font = `700 ${Math.round(H * 0.024)}px ${MONO}`;
  ctx.fillText(`H ${H_ex.toFixed(2)}  ·  ${name}`, W / 2, my + 14);
  ctx.fillStyle = GRAY; ctx.font = `${Math.round(H * 0.016)}px ${MONO}`;
  ctx.fillText(rec, W / 2, my + 14 + H * 0.032);
  ctx.textAlign = "left";
  ctx.restore();
}

function drawCandleBody(ctx, c, alpha, grow, hot) {
  const col = c.up ? GREEN : RED;
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = col; ctx.fillStyle = col;
  ctx.lineWidth = Math.max(1, c.bw * 0.16);
  if (hot) { ctx.shadowBlur = 10; ctx.shadowColor = col; }
  ctx.beginPath(); ctx.moveTo(c.x, c.hy); ctx.lineTo(c.x, c.ly); ctx.stroke();
  const top = Math.min(c.oy, c.cy), full = Math.max(2, Math.abs(c.cy - c.oy));
  const h = full * grow, mid = (c.oy + c.cy) / 2;
  ctx.fillRect(c.x - c.bw / 2, mid - h / 2, c.bw, h);
  ctx.shadowBlur = 0;
}

// Act: candle — the signature. Climb → AI predicts down → crash into the cone.
function drawCandle(ctx, p, env, W, H) {
  const ch = CHART, C = CANDLES;
  const chartAlpha = env;
  if (chartAlpha <= 0.001) return;
  // gentle pull-back "zoom out"
  const zoom = lerp(1.14, 1.0, easeOut(seg(p, 0, 0.20)));
  ctx.save();
  const cxp = ch.x + ch.w * 0.5, cyp = ch.y + ch.h * 0.5;
  ctx.translate(cxp, cyp); ctx.scale(zoom, zoom); ctx.translate(-cxp, -cyp);
  ctx.globalAlpha = chartAlpha;

  // faint chart gridlines + baseline
  ctx.strokeStyle = "rgba(245,245,240,0.06)"; ctx.lineWidth = 1;
  for (let g = 0; g <= 4; g++) {
    const gy = ch.y + (g / 4) * ch.h;
    ctx.beginPath(); ctx.moveTo(ch.x, gy); ctx.lineTo(ch.x + ch.w, gy); ctx.stroke();
  }

  // how many candles are revealed (climb then crash). Climb starts immediately
  // so the act never opens on a blank chart.
  const climbN = Math.round(easeOut(seg(p, 0.03, 0.40)) * C.crash);
  const crashN = Math.round(easeOut(seg(p, 0.46, 0.72)) * (C.N - C.crash));
  const revealed = p < 0.46 ? climbN : C.crash + crashN;

  // candles
  for (let i = 0; i < revealed; i++) {
    const c = C.bars[i];
    // each candle pops in over its own little sub-window near the reveal edge
    const grow = i < revealed - 1 ? 1 : easeOut(clamp((p < 0.46 ? seg(p, 0.03, 0.40) * C.crash : C.crash + seg(p, 0.46, 0.72) * (C.N - C.crash)) - i, 0, 1));
    const hot = i >= revealed - 2; // leading edge glows
    drawCandleBody(ctx, c, chartAlpha, grow, hot);
  }

  // crash screen-shake (deterministic, decays) — applied as a subtle offset
  // handled by re-drawing? keep cheap: a red vignette pulse during the crash.
  const crashHeat = seg(p, 0.48, 0.56) * (1 - seg(p, 0.74, 0.86));
  if (crashHeat > 0.01) {
    const g = ctx.createRadialGradient(W / 2, H * 0.5, H * 0.2, W / 2, H * 0.5, W * 0.62);
    g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, `rgba(255,60,60,${0.16 * crashHeat})`);
    ctx.globalAlpha = 1; ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }

  ctx.globalAlpha = 1;
  ctx.restore();
}

// Act: safety — the capped payoff diagram (defined risk + kill switch).
function drawSafety(ctx, q, env, W, H) {
  const ch = CHART, P = PAYOFF, alpha = env;
  if (alpha <= 0.001) return;
  const draw = easeOut(seg(q, 0.0, 0.45)); // payoff strokes left→right
  ctx.save(); ctx.globalAlpha = alpha;
  const FIG = `500 ${Math.round(Math.min(21.6, Math.max(16.8, W * 0.015)))}px ${MONO}`;
  // zero line — strong enough to read as the line between making and losing
  ctx.strokeStyle = "rgba(245,245,240,0.4)"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(ch.x, P.zeroY); ctx.lineTo(ch.x + ch.w, P.zeroY); ctx.stroke();
  ctx.fillStyle = GRAY; ctx.font = FIG; ctx.textAlign = "right"; ctx.textBaseline = "middle";
  ctx.fillText("$0", ch.x - 8, P.zeroY);
  ctx.textAlign = "left";
  // reveal x
  const revealX = ch.x + ch.w * draw;
  // build clipped polyline path
  const pts = P.pts;
  function pathTo(xLimit) {
    ctx.beginPath();
    let started = false, prev = null;
    for (const pt of pts) {
      if (!started) { ctx.moveTo(pt.x, pt.y); started = true; prev = pt; continue; }
      if (pt.x <= xLimit) { ctx.lineTo(pt.x, pt.y); prev = pt; }
      else {
        const tt = (xLimit - prev.x) / (pt.x - prev.x);
        if (tt > 0) ctx.lineTo(xLimit, lerp(prev.y, pt.y, clamp(tt, 0, 1)));
        break;
      }
    }
  }
  // fills: above zero green, below zero red, both clipped to the reveal
  const area = new Path2D();
  area.moveTo(pts[0].x, P.zeroY);
  for (const pt of pts) area.lineTo(pt.x, pt.y);
  area.lineTo(pts[pts.length - 1].x, P.zeroY); area.closePath();
  // Each side lit from its own line: strongest against the tube, gone at the axis.
  const lossGrad = ctx.createLinearGradient(0, P.lossY, 0, P.zeroY);
  lossGrad.addColorStop(0, withAlpha(RED, 0.26)); lossGrad.addColorStop(1, withAlpha(RED, 0.02));
  const gainGrad = ctx.createLinearGradient(0, P.profY, 0, P.zeroY);
  gainGrad.addColorStop(0, withAlpha(GREEN, 0.12)); gainGrad.addColorStop(1, withAlpha(GREEN, 0.01));
  const sides = [
    [ch.y, P.zeroY - ch.y, gainGrad],
    [P.zeroY, P.lossY - P.zeroY + 2, lossGrad],
  ];
  for (const [y0, h, fill] of sides) {
    ctx.save();
    ctx.beginPath(); ctx.rect(ch.x, y0, ch.w * draw, h); ctx.clip();
    ctx.fillStyle = fill; ctx.fill(area);
    ctx.restore();
  }
  // the payoff line: green where it makes money, red where it loses. LIGHT IS
  // THE HIERARCHY (Gate A2): full strength and glow go only to the loss, its
  // floor and its figure, the one certain number; the conditional upside ramp
  // and its ceiling hold at ~60% until the reader has the loss.
  for (const [y0, h, col, a] of [[ch.y - 8, P.zeroY - ch.y + 8, GREEN, 0.6], [P.zeroY, P.lossY - P.zeroY + 8, RED, 1]]) {
    ctx.save();
    ctx.beginPath(); ctx.rect(ch.x - 40, y0 - (col === RED ? 0 : 30), ch.w + 80, h + 30); ctx.clip();
    ctx.globalAlpha = alpha * a;
    tube(ctx, () => pathTo(revealX), col, 3.2);
    ctx.restore();
  }
  // THE HIERARCHY IS THE HERO'S: loss first. The most it can lose is the one
  // certain number, so it is the act's decision tier, in bear red, set right
  // under the floor it names. The most it can make is conditional, so it is
  // neutral, smaller, and carries its condition. This used to be the other
  // way round: a glowing green "+$420 max profit" as the brightest thing in
  // the frame over a grey "−$80" (re-tribunal regression 4).
  const fs = Math.round(Math.min(21.6, Math.max(16.8, W * 0.015)));
  const SMALL = `500 ${Math.round(fs * 0.72)}px ${MONO}`;
  const money = (v) => "$" + Math.round(Math.abs(v)).toLocaleString("en-US");
  const pos = P.pos || POSITION;
  // THE LABELS ARE READ, SO THEY ARRIVE BY HALF-WAY AND HOLD (Gate A2, d10).
  // They used to finish at q 0.7, a breath before the act began to fade, so
  // the finished frame was on screen for almost no scroll. All four now settle
  // by q 0.5 and hold until the act's out-fade (0.682), about 500px later.
  // the floor: a live guard line where the loss stops
  const guard = seg(q, 0.3, 0.42) * alpha;
  if (guard > 0.02) {
    ctx.globalAlpha = guard; ctx.strokeStyle = RED; ctx.setLineDash([7, 5]); ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(ch.x, P.lossY); ctx.lineTo(ch.x + ch.w, P.lossY); ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = alpha * Math.min(1, guard * 2.5);
    ctx.textAlign = "left"; ctx.textBaseline = "top";
    const big = Math.round(fs * 1.75);
    ctx.font = `700 ${big}px ${MONO}`; ctx.fillStyle = RED;
    const figure = "−" + money(pos.maxLoss);
    ctx.fillText(figure, ch.x, P.lossY + 12);
    ctx.font = SMALL; ctx.fillStyle = GRAY;
    const why = "most it can lose · " + (pos.chosen ? "you set it before the trade" : "an example spread · set your own below");
    ctx.fillText(why, ch.x, P.lossY + 16 + big);
    ctx.globalAlpha = alpha;
  }
  // breakeven: neutral, labelled on the zero axis to the LEFT of the crossing,
  // where the curve never goes (the hero puts its B/E in the same place). It
  // used to sit above the chart's top edge, ~25px under the copy's sub-line.
  const be = seg(q, 0.36, 0.48) * alpha;
  if (be > 0.02) {
    ctx.globalAlpha = be; ctx.strokeStyle = "rgba(245,245,240,0.45)"; ctx.setLineDash([4, 5]); ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(P.beX, P.zeroY - 18); ctx.lineTo(P.beX, P.zeroY + 18); ctx.stroke(); ctx.setLineDash([]);
    ctx.font = SMALL; ctx.fillStyle = GRAY; ctx.textAlign = "right"; ctx.textBaseline = "bottom";
    ctx.fillText("B/E " + pos.breakeven.toFixed(2), P.beX - 8, P.zeroY - 6);
    ctx.textAlign = "left";
    ctx.globalAlpha = alpha;
  }
  // the strikes, in the hero's handle colour, named with their prices: each
  // sits just above the floor, to the left of its own tick, where the curve
  // never goes (left of K1 is the flat floor; between the ramp and K2 is
  // empty), so neither can collide with the loss figure under the floor.
  const lbl = seg(q, 0.4, 0.5) * alpha;
  if (lbl > 0.02) {
    ctx.globalAlpha = lbl; ctx.font = SMALL; ctx.textAlign = "right"; ctx.textBaseline = "bottom";
    ctx.strokeStyle = GRAY; ctx.lineWidth = 1;
    for (const [x, name] of [[P.floorX1, "K1 " + pos.k1], [pts[2].x, "K2 " + pos.k2]]) {
      ctx.beginPath(); ctx.moveTo(x, P.lossY - 6); ctx.lineTo(x, P.lossY + 6); ctx.stroke();
      ctx.fillStyle = CYAN; ctx.fillText(name, x - 8, P.lossY - 8);
    }
    // the upside: neutral, under its own ceiling, with the condition attached.
    // Neutral is not faint: at 75% alpha these measured under 4.5:1 (Gate A2),
    // so they are full GRAY now, smaller and uncoloured, still legible.
    ctx.textAlign = "right"; ctx.textBaseline = "top";
    const rx = ch.x + ch.w, ty = P.profY + 10;
    ctx.globalAlpha = lbl; ctx.font = SMALL; ctx.fillStyle = GRAY;
    ctx.fillText("most it can make", rx, ty);
    ctx.font = `500 ${fs}px ${MONO}`;
    ctx.fillText("+" + money(pos.maxProfit), rx, ty + fs);
    ctx.font = SMALL;
    ctx.fillText("only above " + pos.k2 + " at expiry", rx, ty + fs * 2.3);
    ctx.textAlign = "left";
    ctx.globalAlpha = alpha;
  }
  ctx.restore();
}

// Act: consensus. Twelve models, one spoke each, and a tally of how many agree.
// Colour says agree or not, in the brand's ramp and a neutral: the red and green
// spokes this used to draw meant nothing about money, which is all they mean
// anywhere else.
function drawConsensus(ctx, v, env, W, H) {
  const R = RING, alpha = env;
  if (alpha <= 0.001) return;
  ctx.save();
  let agree = 0;
  const label = `${Math.round(H * 0.014)}px ${MONO}`;
  R.nodes.forEach((nd, i) => {
    const cast = easeOut(seg(v, 0.04 + i * 0.03, 0.46 + i * 0.02));
    const yes = nd.up > 0.6;
    const col = yes ? `rgb(${rampAt(i / (R.nodes.length - 1)).join(",")})` : GRAY;
    const c = Math.cos(nd.a), s = Math.sin(nd.a), inner = R.r * 0.48 * cast, outer = R.r * cast;
    ctx.globalAlpha = alpha * (yes ? 1 : 0.4) * cast;
    tube(ctx, () => { ctx.beginPath(); ctx.moveTo(R.cx + c * inner, R.cy + s * inner); ctx.lineTo(R.cx + c * outer, R.cy + s * outer); }, col, yes ? 1.6 : 1.1, yes ? 0.85 : 0.5);
    ctx.globalAlpha = alpha * cast;
    // a bead of glass at the end of each spoke
    const bx = R.cx + c * outer, by = R.cy + s * outer;
    if (yes) {
      const glow = ctx.createRadialGradient(bx, by, 0, bx, by, 16);
      glow.addColorStop(0, withAlpha(col, 0.5)); glow.addColorStop(1, withAlpha(col, 0));
      ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(bx, by, 16, 0, TAU); ctx.fill();
      ctx.fillStyle = col; ctx.beginPath(); ctx.arc(bx, by, 4.2, 0, TAU); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.85)"; ctx.beginPath(); ctx.arc(bx - 1.2, by - 1.4, 1.5, 0, TAU); ctx.fill();
    } else {
      ctx.strokeStyle = GRAY; ctx.lineWidth = 1.1; ctx.beginPath(); ctx.arc(bx, by, 3.8, 0, TAU); ctx.stroke();
    }
    if (yes && cast > 0.7) agree += 1;
    ctx.globalAlpha = alpha * cast * 0.8; ctx.fillStyle = GRAY;
    ctx.font = label; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(nd.k, R.cx + c * (R.r + 20), R.cy + s * (R.r + 20));
  });
  const arcT = easeOut(seg(v, 0.2, 0.85)) * (agree / R.nodes.length);
  ctx.globalAlpha = alpha;
  ctx.lineWidth = 6; ctx.lineCap = "round"; ctx.strokeStyle = "rgba(245,245,240,0.06)";
  ctx.beginPath(); ctx.arc(R.cx, R.cy, R.r * 0.42, 0, TAU); ctx.stroke();
  if (arcT > 0.002) {
    const arc = () => { ctx.beginPath(); ctx.arc(R.cx, R.cy, R.r * 0.42, -Math.PI / 2, -Math.PI / 2 + TAU * arcT); };
    const ramp = ringGradient(ctx, R.cx, R.cy);
    for (const [lw, a] of [[22, 0.05], [12, 0.1]]) { ctx.globalAlpha = alpha * a; ctx.strokeStyle = ramp; ctx.lineWidth = lw; arc(); ctx.stroke(); }
    ctx.globalAlpha = alpha; ctx.strokeStyle = ramp; ctx.lineWidth = 3.4; arc(); ctx.stroke();
    ctx.strokeStyle = "rgba(255,255,255,0.7)"; ctx.lineWidth = 0.9; arc(); ctx.stroke();
  }
  ctx.lineCap = "butt";
  const shown = Math.round(arcT * R.nodes.length);
  const tierPct = shown / R.nodes.length;
  // The band words from lib/quant/ai-bots.ts BAND_LABEL: what the ring measures
  // is how tightly the models agreed, not a grade on a trade.
  const tier = tierPct >= 0.83 ? "very strong agreement" : tierPct >= 0.7 ? "moderate agreement" : tierPct >= 0.55 ? "lean" : "split";
  ctx.fillStyle = INK; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.font = `600 ${Math.round(H * 0.05)}px ${MONO}`;
  ctx.fillText(`${shown}/${R.nodes.length}`, R.cx, R.cy - H * 0.01);
  ctx.font = `${Math.round(H * 0.016)}px ${MONO}`;
  ctx.fillStyle = GRAY;
  ctx.fillText(tier, R.cx, R.cy + H * 0.032);
  ctx.textAlign = "left";
  ctx.restore();
}

// ================= MAIN =====================================================
window.renderAt = function renderAt(t, hideBull, hideCandle, now, cx, cy, hideDive) {
  NOW = now || 0; // ambient wall-clock (seconds) — keeps the scene alive at rest
  const stage = document.getElementById("stage");
  const W = stage.clientWidth, H = stage.clientHeight;
  const $ = (id) => document.getElementById(id);
  const [outline, mac, base, screen, fly, bullC, bullR, grid, glow] =
    ["outline", "mac", "base", "screen", "panels", "bull", "bullreal", "grid", "glow"].map($);
  const P = PHASES;

  // ---- boot ---------------------------------------------------------------
  // The laptop sketches ITSELF in — time-based, once, starting the moment the
  // loader reveals. The draw-on animation plays for everyone, but the resting
  // frame always ends complete (never a half-drawn sliver held hostage by the
  // scroll position, which was the old bug).
  if (DRAW_T0 === null && NOW > 0) DRAW_T0 = NOW;
  const bootDraw = DRAW_T0 === null ? 0 : easeOut(clamp((NOW - DRAW_T0) / 1.5, 0, 1));
  strokes().forEach(({ p, len }) => { p.style.strokeDashoffset = String(len * (1 - bootDraw)); });
  const outlineFade = 1 - seg(t, P.assembly[0], P.assembly[0] + (P.assembly[1] - P.assembly[0]) * 0.4);
  outline.style.opacity = String(outlineFade);
  // ambient breathing on the boot glow so the opening frame feels alive at rest
  glow.style.opacity = "0";

  // ---- assembly + dive (mac + panels) ------------------------------------
  const pAsm = seg(t, ...P.assembly);
  const pDive = seg(t, ...P.dive);
  const push = easeIO(seg(pDive, 0, 0.5));
  const macScale = lerp(1, 4.5, push); // gentler dive so the panel plates stay sharp
  // The laptop belongs to the retired desk act. Since frame zero the film
  // starts AT the dive, so once the 3D corridor is live the laptop is never
  // the picture: drawing it under the curtain only leaked a double exposure
  // through the tunnel's fade-in. It stays as the fallback entry when the
  // tunnel has no context.
  const macVisible = !hideDive && t >= P.assembly[0] && push < 1;
  mac.style.display = macVisible ? "block" : "none";
  mac.style.opacity = String(seg(pAsm, 0, 0.15));
  mac.style.transform = `translate(-50%, -50%) scale(${macScale}) translateY(${lerp(0, -20, push)}px)`;
  base.style.opacity = String(1 - seg(push, 0.5, 0.9));
  screen.style.boxShadow = push > 0.5 ? "none" : "";
  if (macVisible) {
    document.querySelectorAll("#screen-inner .panel").forEach((el) => {
      const i = Number(el.dataset.i), sp = START_POSES[i];
      const local = easeIO(seg(pAsm, 0.05 + i * 0.055, 0.55 + i * 0.045));
      el.style.transform = `translate(${lerp(sp.x * 1400, 0, local)}px, ${lerp(sp.y * 1000, 0, local)}px) rotate(${lerp(sp.r, 0, local)}deg)`;
      el.style.opacity = String(Math.min(1, local * 2.5));
    });
  }
  // The real-3D tunnel (R3F, parent doc) owns the dive when live → skip the 2D
  // panel flythrough (the laptop zoom stays as the entry the tunnel fades over).
  const flyOn = pDive > 0.45 && t < P.regime[0] + 0.02 && !hideDive;
  fly.style.display = flyOn ? "block" : "none";
  if (flyOn) {
    document.querySelectorAll("#panels .panel").forEach((el) => {
      const i = Number(el.dataset.i), d = PANEL_DEFS[i].dive;
      const f = easeIO(seg(pDive, 0.45 + i * 0.02, 0.98 + i * 0.002));
      const s = lerp(0.55, 3.5, f);
      el.style.transform = `translate(-50%, -50%) translate(${d[0] * f * W * 1.15}px, ${d[1] * f * H * 1.15}px) scale(${s})`;
      el.style.opacity = String((1 - seg(f, 0.72, 1)) * seg(pDive, 0.42, 0.5));
    });
  }
  // One stage: no graph paper behind the acts.
  grid.style.opacity = "0";

  // ---- canvas: exactly one heavy act draws per frame ---------------------
  const ctx = bullC.getContext("2d");
  ctx.setTransform(SCENE_DPR, 0, 0, SCENE_DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);

  // boot flourish: after the outline finishes, a glass sweep crosses the
  // laptop then a power-on pulse blooms — time-based, plays once per reveal.
  if (DRAW_T0 !== null && t < P.assembly[0] + 0.02) {
    const sw = clamp((NOW - DRAW_T0 - 1.55) / 0.9, 0, 1);
    if (sw > 0 && sw < 1) {
      const bandW = W * 0.18;
      const bx = lerp(-0.2 * W, 1.2 * W, easeIO(sw));
      ctx.save();
      ctx.translate(bx, H / 2); ctx.rotate(-18 * Math.PI / 180);
      const bg = ctx.createLinearGradient(-bandW / 2, 0, bandW / 2, 0);
      bg.addColorStop(0, "rgba(200,255,225,0)");
      bg.addColorStop(0.5, "rgba(200,255,225,0.10)");
      bg.addColorStop(1, "rgba(200,255,225,0)");
      ctx.fillStyle = bg;
      ctx.fillRect(-bandW / 2, -H, bandW, H * 2);
      ctx.restore();
    }
    const po = clamp((NOW - DRAW_T0 - 2.5) / 0.5, 0, 1);
    const poA = 0.16 * Math.sin(po * Math.PI); // spike then settle
    if (poA > 0.002) {
      const pg = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.min(W, H) * 0.45);
      pg.addColorStop(0, `rgba(110,120,255,${poA})`);
      pg.addColorStop(1, "rgba(110,120,255,0)");
      ctx.fillStyle = pg; ctx.fillRect(0, 0, W, H);
    }
  }

  // crossfade envelopes overlap at boundaries → no black flash between acts.
  // Gated on CHART so a 0-size init (geometry not built yet) can't NaN/crash.
  if (CHART) {
    // Safety and the vote cross in ONE short dissolve (0.682 → 0.698), and the
    // vote then holds a plateau three times its fade before it clears (Gate
    // A2, d11): at the default fades it overlapped safety for ~555px and never
    // reached full opacity at all. The 3D bull waits for it (BULL3D_SHOW).
    // The worst case leaves before the vote arrives: never one over the other.
    // Between them the payoff's zero line closes on the ring's centre, and
    // the spokes grow out of the point it closes to.
    const eReg = actEnv(t, P.regime), eCan = actEnv(t, P.candle);
    const eSaf = seg(t, P.safety[0] - 0.02, P.safety[0] + 0.02) * (1 - seg(t, 0.672, 0.686));
    const eCon = seg(t, 0.69, 0.704) * (1 - seg(t, 0.722, 0.738));
    // The matter draws the regime's line when it is live (FilmMatter).
    if (eReg > 0.001 && !hideDive) drawRegime(ctx, seg(t, ...P.regime), eReg, W, H);
    // 3D candle canyon (R3F) owns this beat when live → skip the 2D chart.
    if (eCan > 0.001 && !hideCandle) drawCandle(ctx, seg(t, ...P.candle), eCan, W, H);
    if (eSaf > 0.001) drawSafety(ctx, seg(t, ...P.safety), eSaf, W, H);
    // The safety act is the one information frame: the lens vignette lifts
    // off it so the loss figure in the corner shows at the full token red (it
    // measured ~76% under two stacked vignettes, Gate A2). The parent's own
    // vignette follows the same envelope (safetyLight in lib/cinema.ts).
    const vig = document.getElementById("vignette");
    if (vig) vig.style.opacity = "0";
    const closing = seg(t, 0.672, 0.694);
    if (closing > 0 && t < 0.704 && PAYOFF && RING) {
      const e = easeIO(closing), ch = CHART, y = lerp(PAYOFF.zeroY, RING.cy, e);
      ctx.save();
      ctx.globalAlpha = 0.5 * (1 - seg(t, 0.694, 0.704));
      ctx.strokeStyle = INK; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(lerp(ch.x, RING.cx, e), y); ctx.lineTo(lerp(ch.x + ch.w, RING.cx, e), y); ctx.stroke();
      ctx.restore();
    }
    if (eCon > 0.001) drawConsensus(ctx, seg(t, ...P.consensus), eCon, W, H);
  }

  // ---- bull (particle logo) → THE MARK ----------------------------------
  // The real-3D bull (R3F, parent doc) owns ~0.71–0.80. As it STARTS clearing,
  // its particles stand where it stood (the bull's outline) and go straight
  // onto the bull mark, the payoff drawn as a head, where the film ends
  // (Phase 4, M25). Gate A4 #5 cut what stood between: a 2D bull assembling
  // out of scattered dots (0.80–0.855) and holding there, which was the dead
  // tail. LOGO0 starts at the bull's out0, not its out1: starting later left a
  // black frame at the charge. Keep in step with BULL3D.out0 in lib/cinema.ts,
  // with `hideBull` in ScrollCinema.tsx and MARK_REST in cinema-metrics.ts.
  const LOGO0 = 0.80, MARK0 = 0.815, MARK1 = 0.865;
  const bullOn = t >= LOGO0 - 0.01;
  // `hideBull` (per frame) keeps the particle logo hidden while the 3D bull is up.
  if (bullOn && !hideBull) {
    const conv = 1;
    // markFade (set by the page over the hold): the line leaves the mark for
    // the instrument, so the particles that drew the mark go with it rather
    // than stand behind as a second mark.
    const brightness = (0.35 + 0.65 * easeOut(seg(t, LOGO0, MARK0))) * (1 - (window.markFade || 0));
    for (const pt of PARTICLES) {
      // Each particle leaves the bull on its own beat, in order along the
      // mark, so the mark draws itself left horn to right horn.
      const m = easeIO(seg(t, MARK0 + pt.mt * 0.025, MARK1 - 0.025 + pt.mt * 0.025));
      const bx = pt.tx, by = pt.ty;
      const x = lerp(bx, pt.mx, m), y = lerp(by, pt.my, m) - Math.sin(m * Math.PI) * 26;
      ctx.globalAlpha = (0.35 + 0.65 * conv) * brightness;
      ctx.shadowBlur = pt.glow ? 10 : 0; ctx.shadowColor = "#7b8cff";
      // On the mark the particles take the ramp across it, violet to mint.
      ctx.fillStyle = m > 0.5 ? `rgb(${rampAt(pt.mt).join(",")})` : pt.tint < 0.6 ? `rgb(${rampAt(pt.tint / 0.6).join(",")})` : INK;
      ctx.fillRect(x, y, pt.size, pt.size);
    }
    ctx.globalAlpha = 1; ctx.shadowBlur = 0;
    // Once the particles are home, the mark's own line comes up under them:
    // a crisp monoline in the brand ramp, so the last frame reads as the logo.
    // On the desktop film the parent page draws this line instead, over the
    // stage, because over the hold it leaves the stage: it bends into the
    // visitor's payoff and lands on the instrument (ScrollCinema, the match-
    // cut). The phone film and any other host leave it to the scene.
    const line = window.markLineExternal ? 0 : seg(t, MARK1 - 0.01, MARK1 + 0.03);
    if (line > 0.002) {
      const g = ctx.createLinearGradient(MARK_BOX.x, 0, MARK_BOX.x + MARK_BOX.w, 0);
      g.addColorStop(0, `rgb(${rampAt(0).join(",")})`);
      g.addColorStop(0.5, `rgb(${rampAt(0.5).join(",")})`);
      g.addColorStop(1, `rgb(${rampAt(1).join(",")})`);
      ctx.save();
      ctx.globalAlpha = line;
      ctx.strokeStyle = g; ctx.lineWidth = Math.max(2, MARK_BOX.w / 90);
      ctx.lineJoin = "round"; ctx.lineCap = "round";
      ctx.shadowBlur = 18; ctx.shadowColor = "rgba(110,120,255,0.55)";
      ctx.beginPath();
      BULL_MARK.forEach(([mx, my], i) => {
        const X = MARK_BOX.x + mx * MARK_BOX.w, Y = MARK_BOX.y + my * MARK_BOX.h;
        if (i) ctx.lineTo(X, Y); else ctx.moveTo(X, Y);
      });
      ctx.stroke();
      ctx.restore();
    }
    const glowX = lerp(W / 2, MARK_BOX.x + MARK_BOX.w / 2, seg(t, MARK0, MARK1));
    const g = ctx.createRadialGradient(glowX, H * 0.58, 10, glowX, H * 0.58, W * 0.3);
    g.addColorStop(0, `rgba(110,120,255,${0.16 * conv * brightness})`);
    g.addColorStop(1, "rgba(110,120,255,0)");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  bullR.style.opacity = "0";

  return true;
};
</script>
